name: Bug report
description: Report a reproducible TextForensics defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private source documents, API keys, or other secrets. Security vulnerabilities belong in a private security advisory.
  - type: input
    id: version
    attributes:
      label: TextForensics version
      description: Output of `textforensics --version`
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Local browser UI
        - HTTP API
        - MCP
        - Detector plugin
        - Container
        - Packaging / installation
        - Benchmark / calibration
        - Provenance / case file
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, installation/container mode
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic/redacted content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private document text, credentials, and secrets.
          required: true
