name: Feature request
description: Propose an evidence, reliability, integration, or platform improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or reliability problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detector protocol / plugin
        - Benchmark / calibration
        - Trust Map / reliability
        - Observatory / drift
        - Provenance / case files
        - CLI / API / MCP / UI
        - Packaging / operations
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Links to primary papers/repos/specifications when relevant.
  - type: checkboxes
    id: semantics
    attributes:
      label: Semantics
      options:
        - label: This request does not require presenting an uncalibrated score as an authorship probability.
          required: true
