name: Mutation Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2 AM UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mutation mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - diff
          - safety-critical

concurrency:
  group: mutation-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  mutation-diff:
    name: Diff-based Mutation (Push)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history for diff

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,enterprise]"
          pip install "cosmic-ray>=8.0,<9"

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            # Push events: github.event.before is the pre-push HEAD. origin/main
            # must NOT be used here — after checkout HEAD == origin/main, so a
            # diff against it is empty by construction.
            BASE_SHA="${{ github.event.before }}"
          fi
          # First push of a branch (or a force-push): `before` is all zeros.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
          CHANGED=$(git diff --name-only "$BASE_SHA...HEAD" -- '*.py' | grep -E '^src/textforensics/(benchmark|trust|consensus|calibration|detectors|analyzers|engine|policy|casefile)\.py$' || true)
          {
            echo "changed_files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Run diff-based mutation testing
        if: steps.changed-files.outputs.changed_files != ''
        id: mutation-diff
        run: |
          python scripts/run_mutation.py --mode diff --base-sha ${{ steps.changed-files.outputs.base_sha }}

      - name: No mutation needed
        if: steps.changed-files.outputs.changed_files == ''
        run: |
          echo "No safety-critical modules changed - writing skipped summary"
          mkdir -p mutation-results
          # skipped_reason marks the legitimate no-op case; check_results
          # accepts it (exit 0). Without the marker a zero summary fails.
          echo '{"total": 0, "killed": 0, "surviving": 0, "timeout": 0, "error": 0, "skipped": 0, "incompetent": 0, "pending": 0, "skipped_reason": "no-relevant-changes"}' > mutation-results/summary.json

      - name: Upload mutation results (diff)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results-diff-${{ github.sha }}
          path: |
            mutation-results/
            cosmic-ray-*.json
            cosmic-ray-*.sqlite
          retention-days: 90

      # if: always() is intentional here: check_results accepts the
      # no-relevant-changes marker (exit 0) and fails a genuinely empty
      # summary (exit 1), so the check must run on both branches. Do not
      # gate this step on changed_files — that output was never set before
      # this fix, which made the gate vacuous.
      - name: Check mutation results (diff)
        if: always()
        run: |
          if [ -f mutation-results/summary.json ]; then
            python scripts/run_mutation.py --check-results mutation-results/summary.json
          else
            echo "No mutation results found"
            exit 1
          fi

  mutation-full:
    name: Full Mutation (Weekly / Safety-Critical)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,enterprise]"
          pip install "cosmic-ray>=8.0,<9"

      - name: Run full mutation testing
        id: mutation-full
        run: |
          python scripts/run_mutation.py --mode full

      - name: Run safety-critical deep mutation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'safety-critical'
        id: mutation-safety
        run: |
          python scripts/run_mutation.py --mode safety-critical

      - name: Upload mutation results (full)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results-full-${{ github.sha }}
          path: |
            mutation-results/
            cosmic-ray-*.json
            cosmic-ray-*.sqlite
          retention-days: 90

      - name: Check mutation results (full)
        if: always()
        run: |
          if [ -f mutation-results/summary.json ]; then
            python scripts/run_mutation.py --check-results mutation-results/summary.json
          else
            echo "No mutation results found"
            exit 1
          fi

  mutation-report:
    name: Mutation Report Summary
    needs: [mutation-diff, mutation-full]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Download all mutation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-results-*
          path: artifacts/

      # ENG-07(6): the full-mutation job is skipped on push/pull_request
      # by design (it runs only on schedule/workflow_dispatch), but the
      # old report said nothing about it, so the push check read as
      # "mutation passed" with no full mutation work executed. This step
      # writes a machine-readable status file using the shared gate
      # vocabulary — pass / fail / skipped / not_applicable / zero_work —
      # with measured work counts and a reason, so the canonical
      # verification command can observe that no full mutation work
      # executed for this SHA. A skipped/not_applicable job is recorded
      # as such; it is never relabelled as passed.
      - name: Record mutation execution status
        env:
          DIFF_RESULT: ${{ needs.mutation-diff.result }}
          FULL_RESULT: ${{ needs.mutation-full.result }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_summary(kind):
              for path in Path("artifacts").glob(f"mutation-results-{kind}-*/summary.json"):
                  return json.loads(path.read_text(encoding="utf-8"))
              return None

          def job_status(result, summary, *, full_job):
              if result == "success":
                  if summary and summary.get("skipped_reason") == "no-relevant-changes":
                      return ("skipped", 0, "no-relevant-changes: no safety-critical modules changed")
                  total = int((summary or {}).get("total", 0))
                  return ("pass", total, f"executed {total} mutant(s)")
              if result == "failure":
                  total = int((summary or {}).get("total", 0))
                  return ("fail", total, "mutation job failed (see its logs)")
              if result == "cancelled":
                  return ("error", 0, "mutation job was cancelled")
              # result == "skipped": the job's `if:` condition was false.
              if full_job:
                  return (
                      "not_applicable",
                      0,
                      "full mutation runs only on schedule/workflow_dispatch; "
                      "not applicable to push/pull_request events — no full "
                      "mutation work executed for this SHA",
                  )
              return ("skipped", 0, "job skipped by its event condition")

          diff_summary = load_summary("diff")
          full_summary = load_summary("full")
          diff_status, diff_total, diff_reason = job_status(
              os.environ["DIFF_RESULT"], diff_summary, full_job=False
          )
          full_status, full_total, full_reason = job_status(
              os.environ["FULL_RESULT"], full_summary, full_job=True
          )
          status = {
              "schema": "textforensics.mutation-status/v1",
              "sha": os.environ["SHA"],
              "event": os.environ["EVENT_NAME"],
              "jobs": {
                  "mutation-diff": {
                      "status": diff_status,
                      "mutants_executed": diff_total,
                      "reason": diff_reason,
                  },
                  "mutation-full": {
                      "status": full_status,
                      "mutants_executed": full_total,
                      "reason": full_reason,
                  },
              },
          }
          Path("mutation-status.json").write_text(
              json.dumps(status, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(status, indent=2))
          PY

      - name: Upload mutation status
        uses: actions/upload-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-status-${{ github.sha }}
          path: mutation-status.json
          retention-days: 90

      - name: Generate summary report
        run: |
          echo "## Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Mutants executed | Reason |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|------------------|--------|" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          status = json.load(open("mutation-status.json", encoding="utf-8"))
          for job, info in status["jobs"].items():
              print(f"| {job} | {info['status']} | {info['mutants_executed']} | {info['reason']} |")
          PY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Run | Status | Surviving | Killed | Timeout |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          for artifact in artifacts/mutation-results-*/; do
            if [ -f "$artifact/summary.json" ]; then
              name=$(basename "$artifact")
              surviving=$(jq -r '.surviving // 0' "$artifact/summary.json")
              killed=$(jq -r '.killed // 0' "$artifact/summary.json")
              timeout=$(jq -r '.timeout // 0' "$artifact/summary.json")
              status="✅ Passed"
              if [ "$surviving" -gt 0 ]; then
                status="⚠️ Surviving mutants"
              fi
              echo "| $name | $status | $surviving | $killed | $timeout |" >> $GITHUB_STEP_SUMMARY
            fi
          done
