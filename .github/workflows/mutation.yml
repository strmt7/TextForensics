name: Mutation Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday 2 AM UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mutation mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - diff
          - safety-critical

concurrency:
  group: mutation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  mutation-diff:
    name: Diff-based Mutation (Push)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,enterprise]"
          pip install "cosmic-ray>=8.0,<9"

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="origin/main"
          fi
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
          CHANGED=$(git diff --name-only $BASE_SHA...HEAD -- '*.py' | grep -E '^src/textforensics/(benchmark|trust|consensus|threshold_selection|detectors|analyzers|engine|capability_ledger|casefile|robustness)\.py$' || true)
          {
            echo 'changed_files<<EOF'
            echo "$CHANGED"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
          echo "Changed target modules:"
          echo "$CHANGED"

      - name: Run diff-based mutation testing
        if: steps.changed-files.outputs.changed_files != ''
        id: mutation-diff
        run: |
          python scripts/run_mutation.py --mode diff --base-sha ${{ steps.changed-files.outputs.base_sha }}

      - name: No mutation needed
        if: steps.changed-files.outputs.changed_files == ''
        run: |
          echo "No safety-critical modules changed - writing empty summary"
          mkdir -p mutation-results
          echo '{"total": 0, "killed": 0, "surviving": 0, "timeout": 0, "error": 0, "skipped": 0}' > mutation-results/summary.json

      - name: Upload mutation results (diff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results-diff-${{ github.sha }}
          path: |
            mutation-results/
            cosmic-ray-*.json
            cosmic-ray-*.sqlite
          retention-days: 90

      - name: Check mutation results (diff)
        if: always()
        run: |
          if [ -f mutation-results/summary.json ]; then
            python scripts/run_mutation.py --check-results mutation-results/summary.json
          else
            echo "No mutation results found"
            exit 1
          fi

  mutation-full:
    name: Full Mutation (Weekly / Safety-Critical)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,enterprise]"
          pip install "cosmic-ray>=8.0,<9"

      - name: Run full mutation testing
        id: mutation-full
        run: |
          python scripts/run_mutation.py --mode full

      - name: Run safety-critical deep mutation
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'safety-critical'
        id: mutation-safety
        run: |
          python scripts/run_mutation.py --mode safety-critical

      - name: Upload mutation results (full)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results-full-${{ github.sha }}
          path: |
            mutation-results/
            cosmic-ray-*.json
            cosmic-ray-*.sqlite
          retention-days: 90

      - name: Check mutation results (full)
        if: always()
        run: |
          if [ -f mutation-results/summary.json ]; then
            python scripts/run_mutation.py --check-results mutation-results/summary.json
          else
            echo "No mutation results found"
            exit 1
          fi

  mutation-report:
    name: Mutation Report Summary
    needs: [mutation-diff, mutation-full]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all mutation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-results-*
          path: artifacts/

      - name: Generate summary report
        run: |
          echo "## Mutation Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Run | Status | Surviving | Killed | Timeout |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY

          for artifact in artifacts/mutation-results-*/; do
            if [ -f "$artifact/summary.json" ]; then
              name=$(basename "$artifact")
              surviving=$(jq -r '.surviving // 0' "$artifact/summary.json")
              killed=$(jq -r '.killed // 0' "$artifact/summary.json")
              timeout=$(jq -r '.timeout // 0' "$artifact/summary.json")
              status="✅ Passed"
              if [ "$surviving" -gt 0 ]; then
                status="⚠️ Surviving mutants"
              fi
              echo "| $name | $status | $surviving | $killed | $timeout |" >> $GITHUB_STEP_SUMMARY
            fi
          done
