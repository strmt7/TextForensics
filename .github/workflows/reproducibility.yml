name: Reproducibility

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_NO_WARN_SCRIPT_LOCATION: 1
  PYTHONHASHSEED: 0
  SOURCE_DATE_EPOCH: 1704067200  # 2024-01-01 00:00:00 UTC, fixed for reproducible builds

jobs:
  build-reproducibility:
    name: Build Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build==1.2.2 setuptools==79.0.1 wheel==0.45.1

      - name: Normalize file timestamps before first build
        run: |
          python -c "import os; [os.utime(os.path.join(root, f), (1704067200, 1704067200)) for root, _, files in os.walk('.') for f in files if f.endswith(('.py', '.toml', '.json'))]"

      - name: Build wheel (first pass)
        run: |
          rm -rf dist_first build src/*.egg-info
          SOURCE_DATE_EPOCH=1704067200 PYTHONHASHSEED=0 python -m build --no-isolation --wheel --outdir dist_first
          WHEEL1=$(sha256sum dist_first/*.whl | cut -d' ' -f1)
          echo "First wheel hash: $WHEEL1"
          echo "WHEEL1=$WHEEL1" >> "$GITHUB_ENV"

      - name: Normalize file timestamps and rebuild (second pass)
        run: |
          python -c "import os; [os.utime(os.path.join(root, f), (1704067200, 1704067200)) for root, _, files in os.walk('.') for f in files if f.endswith(('.py', '.toml', '.json'))]"
          rm -rf build src/*.egg-info
          SOURCE_DATE_EPOCH=1704067200 PYTHONHASHSEED=0 python -m build --no-isolation --wheel --outdir dist_second
          WHEEL2=$(sha256sum dist_second/*.whl | cut -d' ' -f1)
          echo "Second wheel hash: $WHEEL2"
          echo "WHEEL2=$WHEEL2" >> "$GITHUB_ENV"

      - name: Compare wheel hashes
        run: |
          echo "Wheel 1: $WHEEL1"
          echo "Wheel 2: $WHEEL2"
          if [ "$WHEEL1" = "$WHEEL2" ]; then
            echo "PASS: Wheel builds are reproducible"
          else
            echo "FAIL: Wheel builds differ"
            exit 1
          fi

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist_first/
            dist_second/
          retention-days: 30

  cli-determinism:
    name: CLI Determinism (jq-filtered)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Create test input
        run: |
          mkdir -p testdata
          cat > testdata/sample.txt << 'EOF'
          This is a sample text for reproducibility testing.
          It contains multiple sentences to ensure meaningful analysis.
          The text should produce identical results across multiple runs.
          We will verify that the CLI outputs are deterministic.
          This helps ensure the reliability of the detection system.
          EOF

      - name: Run CLI scan 5 times and filter non-deterministic fields
        run: |
          mkdir -p evidence
          FILTER='walk(if type == "object" then del(.runtime_ms, .generated_at_utc, .timestamp, .created_at, .generated_at) else . end)'
          for i in 1 2 3 4 5; do
            python -m textforensics.cli scan --file testdata/sample.txt --json \
              | jq "$FILTER" > "evidence/scan_run_$i.json"
          done

      - name: Verify CLI scan determinism
        run: |
          HASH1=$(sha256sum evidence/scan_run_1.json | cut -d' ' -f1)
          echo "Run 1 hash: $HASH1"
          FAIL=0
          for i in 2 3 4 5; do
            HASH=$(sha256sum "evidence/scan_run_$i.json" | cut -d' ' -f1)
            if [ "$HASH" != "$HASH1" ]; then
              echo "FAIL: Run $i differs from run 1"
              diff <(cat evidence/scan_run_1.json) <(cat "evidence/scan_run_$i.json") || true
              FAIL=1
            fi
          done
          if [ "$FAIL" = "0" ]; then
            echo "PASS: All 5 CLI scan runs produced identical jq-filtered output"
          else
            exit 1
          fi

      - name: Upload CLI evidence
        uses: actions/upload-artifact@v4
        with:
          name: cli-evidence
          path: evidence/
          retention-days: 30

  case-file-determinism:
    name: Case File Determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Create test input
        run: |
          mkdir -p testdata
          cat > testdata/sample.txt << 'EOF'
          This is a sample text for case-file reproducibility testing.
          It contains multiple sentences to ensure meaningful analysis.
          EOF

      - name: Export case file twice with --deterministic
        run: |
          python -m textforensics.cli case export --file testdata/sample.txt --output c1.json --deterministic
          python -m textforensics.cli case export --file testdata/sample.txt --output c2.json --deterministic

      - name: Verify case_sha256 matches across both exports
        run: |
          SHA1=$(jq -r '.case_sha256' c1.json)
          SHA2=$(jq -r '.case_sha256' c2.json)
          echo "Export 1 case_sha256: $SHA1"
          echo "Export 2 case_sha256: $SHA2"
          if [ "$SHA1" = "$SHA2" ] && [ "$SHA1" != "null" ]; then
            echo "PASS: Case files are deterministic (--deterministic produces identical case_sha256)"
          else
            echo "FAIL: case_sha256 differs between deterministic exports"
            exit 1
          fi

  detector-determinism:
    name: Detector Determinism (jq-filtered)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Create test input
        run: |
          mkdir -p testdata
          cat > testdata/sample.txt << 'EOF'
          This is a sample text for detector determinism testing.
          It contains multiple sentences to ensure meaningful analysis.
          The text should produce identical results across multiple runs.
          EOF

      - name: Run report 5 times and filter non-deterministic fields
        run: |
          mkdir -p evidence
          FILTER='walk(if type == "object" then del(.runtime_ms, .generated_at_utc, .timestamp, .created_at, .generated_at) else . end)'
          for i in 1 2 3 4 5; do
            python -m textforensics.cli report --file testdata/sample.txt --deterministic \
              | jq "$FILTER" > "evidence/report_run_$i.json"
          done

      - name: Verify detector report determinism
        run: |
          HASH1=$(sha256sum evidence/report_run_1.json | cut -d' ' -f1)
          echo "Run 1 hash: $HASH1"
          FAIL=0
          for i in 2 3 4 5; do
            HASH=$(sha256sum "evidence/report_run_$i.json" | cut -d' ' -f1)
            if [ "$HASH" != "$HASH1" ]; then
              echo "FAIL: Run $i differs from run 1"
              diff <(cat evidence/report_run_1.json) <(cat "evidence/report_run_$i.json") || true
              FAIL=1
            fi
          done
          if [ "$FAIL" = "0" ]; then
            echo "PASS: All 5 detector report runs produced identical jq-filtered output"
          else
            exit 1
          fi

      - name: Upload detector evidence
        uses: actions/upload-artifact@v4
        with:
          name: detector-evidence
          path: evidence/
          retention-days: 30

  reproducibility-summary:
    name: Reproducibility Summary
    runs-on: ubuntu-latest
    needs: [build-reproducibility, cli-determinism, case-file-determinism, detector-determinism]
    if: always()

    steps:
      - name: Check all reproducibility results
        run: |
          echo "=== Reproducibility Workflow Summary ==="
          echo ""
          echo "Build Reproducibility:    ${{ needs.build-reproducibility.result }}"
          echo "CLI Determinism:          ${{ needs.cli-determinism.result }}"
          echo "Case File Determinism:    ${{ needs.case-file-determinism.result }}"
          echo "Detector Determinism:     ${{ needs.detector-determinism.result }}"
          echo ""

          FAILED=0
          if [ "${{ needs.build-reproducibility.result }}" != "success" ]; then FAILED=1; fi
          if [ "${{ needs.cli-determinism.result }}" != "success" ]; then FAILED=1; fi
          if [ "${{ needs.case-file-determinism.result }}" != "success" ]; then FAILED=1; fi
          if [ "${{ needs.detector-determinism.result }}" != "success" ]; then FAILED=1; fi

          if [ "$FAILED" = "0" ]; then
            echo "PASS: All reproducibility checks passed."
            echo "- Wheel builds are deterministic with SOURCE_DATE_EPOCH=1704067200"
            echo "- PYTHONHASHSEED=0 ensures consistent hashing"
            echo "- Pinned build deps (setuptools 79.0.1, wheel 0.45.1) for stable output"
            echo "- CLI/case-file/detector outputs are deterministic after jq-filtering runtime fields"
          else
            echo "FAIL: One or more reproducibility checks failed."
            exit 1
          fi
