name: Reproducibility

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  PIP_NO_WARN_SCRIPT_LOCATION: 1
  PYTHONHASHSEED: 0
  PYTHONFAULTHANDLER: 1

jobs:
  build-reproducibility:
    name: Build Reproducibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
    
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel
    
      - name: Build wheel and sdist (first pass)
        run: |
          python -m build --outdir dist_first
          sha256sum dist_first/* 2>/dev/null || sha256sum dist_first/*
          mkdir -p artifacts
          cp dist_first/* artifacts/
        shell: bash
    
      - name: Clean and rebuild (second pass)
        run: |
          rm -rf dist_first build *.egg-info src/*.egg-info
          python -m build --outdir dist_second
          sha256sum dist_second/* 2>/dev/null || sha256sum dist_second/*
          cp dist_second/* artifacts/
        shell: bash
    
      - name: Compare build artifacts
        id: compare
        run: |
          echo "Comparing wheel hashes..."
          WHEEL1=$(sha256sum dist_first/*.whl 2>/dev/null | cut -d' ' -f1 || sha256sum dist_first/*.whl | cut -d' ' -f1)
          WHEEL2=$(sha256sum dist_second/*.whl 2>/dev/null | cut -d' ' -f1 || sha256sum dist_second/*.whl | cut -d' ' -f1)
          
          echo "Wheel 1: $WHEEL1"
          echo "Wheel 2: $WHEEL2"
          
          if [ "$WHEEL1" = "$WHEEL2" ]; then
            echo "WHEEL_MATCH=true" >> $GITHUB_OUTPUT
            echo "✓ Wheel builds are reproducible"
          else
            echo "WHEEL_MATCH=false" >> $GITHUB_OUTPUT
            echo "✗ Wheel builds differ!"
            exit 1
          fi
          
          echo "Comparing sdist hashes..."
          SDIST1=$(sha256sum dist_first/*.tar.gz 2>/dev/null | cut -d' ' -f1 || sha256sum dist_first/*.tar.gz | cut -d' ' -f1)
          SDIST2=$(sha256sum dist_second/*.tar.gz 2>/dev/null | cut -d' ' -f1 || sha256sum dist_second/*.tar.gz | cut -d' ' -f1)
          
          echo "Sdist 1: $SDIST1"
          echo "Sdist 2: $SDIST2"
          
          if [ "$SDIST1" = "$SDIST2" ]; then
            echo "SDIST_MATCH=true" >> $GITHUB_OUTPUT
            echo "✓ Sdist builds are reproducible"
          else
            echo "SDIST_MATCH=false" >> $GITHUB_OUTPUT
            echo "✗ Sdist builds differ!"
            exit 1
          fi
        shell: bash
    
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/
          retention-days: 30
    
      - name: Save build evidence
        run: |
          mkdir -p evidence
          cat > evidence/build_evidence.json << EOF
          {
            "os": "${{ matrix.os }}",
            "python_version": "${{ matrix.python-version }}",
            "wheel_reproducible": ${{ steps.compare.outputs.WHEEL_MATCH }},
            "sdist_reproducible": ${{ steps.compare.outputs.SDIST_MATCH }},
            "wheel_sha256": "$WHEEL1",
            "sdist_sha256": "$SDIST1",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
        shell: bash
    
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: evidence/
          retention-days: 30

  cli-determinism:
    name: CLI Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
    
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
    
      - name: Create test input
        run: |
          mkdir -p testdata
          cat > testdata/sample.txt << 'EOF'
          This is a sample text for reproducibility testing.
          It contains multiple sentences to ensure meaningful analysis.
          The text should produce identical results across multiple runs.
          We will verify that the CLI outputs are deterministic.
          This helps ensure the reliability of the detection system.
          EOF
        shell: bash
    
      - name: Run CLI scan 5 times
        run: |
          mkdir -p evidence
          for i in 1 2 3 4 5; do
            python -m textforensics.cli scan --file testdata/sample.txt --json > evidence/scan_run_$i.json
          done
        shell: bash
    
      - name: Verify CLI scan determinism
        id: scan_check
        run: |
          echo "Verifying CLI scan determinism..."
          HASH1=$(sha256sum evidence/scan_run_1.json | cut -d' ' -f1)
          ALL_MATCH=true
          
          for i in 2 3 4 5; do
            HASH=$(sha256sum evidence/scan_run_$i.json | cut -d' ' -f1)
            if [ "$HASH" != "$HASH1" ]; then
              echo "✗ Run $i differs from run 1"
              echo "Run 1: $HASH1"
              echo "Run $i: $HASH"
              diff evidence/scan_run_1.json evidence/scan_run_$i.json || true
              ALL_MATCH=false
            fi
          done
          
          if [ "$ALL_MATCH" = "true" ]; then
            echo "SCAN_DETERMINISTIC=true" >> $GITHUB_OUTPUT
            echo "✓ All 5 CLI scan runs produced identical output"
          else
            echo "SCAN_DETERMINISTIC=false" >> $GITHUB_OUTPUT
            echo "✗ CLI scan outputs differ!"
            exit 1
          fi
        shell: bash
    
      - name: Run CLI report 3 times
        run: |
          for i in 1 2 3; do
            python -m textforensics.cli report --file testdata/sample.txt --output evidence/report_run_$i.json
          done
        shell: bash
    
      - name: Verify CLI report determinism (excluding timestamp)
        id: report_check
        run: |
          echo "Verifying CLI report determinism (excluding timestamps)..."
          # Remove generated_at_utc field for comparison
          for i in 1 2 3; do
            jq 'del(.generated_at_utc)' evidence/report_run_$i.json > evidence/report_run_${i}_notime.json
          done
          
          HASH1=$(sha256sum evidence/report_run_1_notime.json | cut -d' ' -f1)
          ALL_MATCH=true
          
          for i in 2 3; do
            HASH=$(sha256sum evidence/report_run_${i}_notime.json | cut -d' ' -f1)
            if [ "$HASH" != "$HASH1" ]; then
              echo "✗ Report run $i differs from run 1"
              diff evidence/report_run_1_notime.json evidence/report_run_${i}_notime.json || true
              ALL_MATCH=false
            fi
          done
          
          if [ "$ALL_MATCH" = "true" ]; then
            echo "REPORT_DETERMINISTIC=true" >> $GITHUB_OUTPUT
            echo "✓ All 3 CLI report runs produced identical output (excluding timestamps)"
          else
            echo "REPORT_DETERMINISTIC=false" >> $GITHUB_OUTPUT
            echo "✗ CLI report outputs differ!"
            exit 1
          fi
        shell: bash
    
      - name: Upload CLI evidence
        uses: actions/upload-artifact@v4
        with:
          name: cli-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: evidence/
          retention-days: 30

  case-file-determinism:
    name: Case File Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
    
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
    
      - name: Create test input
        run: |
          mkdir -p testdata
          cat > testdata/sample.txt << 'EOF'
          This is a sample text for case file reproducibility testing.
          It contains multiple sentences to ensure meaningful analysis.
          The text should produce identical case files across multiple runs.
          We verify that case file generation is deterministic.
          This ensures the integrity of forensic case files.
          EOF
        shell: bash
    
      - name: Generate case files twice
        run: |
          mkdir -p evidence
          python -m textforensics.cli case export --file testdata/sample.txt --output evidence/case_run_1.json
          python -m textforensics.cli case export --file testdata/sample.txt --output evidence/case_run_2.json
        shell: bash
    
      - name: Verify case file determinism
        id: case_check
        run: |
          echo "Verifying case file determinism..."
          
          # Extract and compare case_sha256 from both files
          CASE_HASH1=$(jq -r '.case_sha256' evidence/case_run_1.json)
          CASE_HASH2=$(jq -r '.case_sha256' evidence/case_run_2.json)
          
          echo "Case 1 hash: $CASE_HASH1"
          echo "Case 2 hash: $CASE_HASH2"
          
          if [ "$CASE_HASH1" = "$CASE_HASH2" ]; then
            echo "CASE_DETERMINISTIC=true" >> $GITHUB_OUTPUT
            echo "✓ Case files are deterministic"
          else
            echo "CASE_DETERMINISTIC=false" >> $GITHUB_OUTPUT
            echo "✗ Case files differ!"
            diff evidence/case_run_1.json evidence/case_run_2.json || true
            exit 1
          fi
          
          # Verify the case file integrity
          python -m textforensics.cli case verify evidence/case_run_1.json
          python -m textforensics.cli case verify evidence/case_run_2.json
        shell: bash
    
      - name: Upload case file evidence
        uses: actions/upload-artifact@v4
        with:
          name: case-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: evidence/
          retention-days: 30

  detector-determinism:
    name: Detector Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
    
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
    
      - name: Create test input
        run: |
          mkdir -p testdata
          cat > testdata/sample.txt << 'EOF'
          This is a sample text for detector reproducibility testing.
          It contains multiple sentences to ensure meaningful analysis.
          The text should produce identical detector results across runs.
          We verify that detector outputs are deterministic.
          This ensures the reliability of the detection system.
          EOF
        shell: bash
    
      - name: Run detector suite 5 times
        run: |
          mkdir -p evidence
          for i in 1 2 3 4 5; do
            python -m textforensics.cli detectors --json > evidence/detector_run_$i.json
            python -m textforensics.cli report --file testdata/sample.txt --output evidence/report_run_$i.json
          done
        shell: bash
    
      - name: Verify detector metadata determinism
        id: detector_check
        run: |
          echo "Verifying detector metadata determinism..."
          HASH1=$(sha256sum evidence/detector_run_1.json | cut -d' ' -f1)
          ALL_MATCH=true
          
          for i in 2 3 4 5; do
            HASH=$(sha256sum evidence/detector_run_$i.json | cut -d' ' -f1)
            if [ "$HASH" != "$HASH1" ]; then
              echo "✗ Detector run $i differs from run 1"
              diff evidence/detector_run_1.json evidence/detector_run_$i.json || true
              ALL_MATCH=false
            fi
          done
          
          if [ "$ALL_MATCH" = "true" ]; then
            echo "DETECTOR_DETERMINISTIC=true" >> $GITHUB_OUTPUT
            echo "✓ Detector metadata is deterministic"
          else
            echo "DETECTOR_DETERMINISTIC=false" >> $GITHUB_OUTPUT
            echo "✗ Detector metadata differs!"
            exit 1
          fi
        shell: bash
    
      - name: Verify detector results determinism (excluding runtime)
        id: results_check
        run: |
          echo "Verifying detector results determinism..."
          # Remove runtime_ms fields for comparison
          for i in 1 2 3 4 5; do
            jq 'del(.detector_results[].runtime_ms) | del(.detector_failures[].runtime_ms)' evidence/report_run_$i.json > evidence/report_run_${i}_notime.json
          done
          
          HASH1=$(sha256sum evidence/report_run_1_notime.json | cut -d' ' -f1)
          ALL_MATCH=true
          
          for i in 2 3 4 5; do
            HASH=$(sha256sum evidence/report_run_${i}_notime.json | cut -d' ' -f1)
            if [ "$HASH" != "$HASH1" ]; then
              echo "✗ Report run $i differs from run 1"
              diff evidence/report_run_1_notime.json evidence/report_run_${i}_notime.json || true
              ALL_MATCH=false
            fi
          done
          
          if [ "$ALL_MATCH" = "true" ]; then
            echo "RESULTS_DETERMINISTIC=true" >> $GITHUB_OUTPUT
            echo "✓ Detector results are deterministic (excluding runtime)"
          else
            echo "RESULTS_DETERMINISTIC=false" >> $GITHUB_OUTPUT
            echo "✗ Detector results differ!"
            exit 1
          fi
        shell: bash
    
      - name: Upload detector evidence
        uses: actions/upload-artifact@v4
        with:
          name: detector-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: evidence/
          retention-days: 30

  trust-map-determinism:
    name: Trust Map Determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
    
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
    
      - name: Create test input
        run: |
          mkdir -p testdata
          cat > testdata/sample.txt << 'EOF'
          This is a sample text for Trust Map reproducibility testing.
          It contains multiple sentences to ensure meaningful analysis.
          The text should produce identical Trust Map outputs across runs.
          We verify that Trust Map generation is deterministic.
          This ensures the reliability of trust assessments.
          Additional text to meet minimum length requirements for analysis.
          More content to ensure robust feature extraction.
          Final sentence for completeness.
          EOF
        shell: bash
    
      - name: Generate Trust Map outputs 5 times
        run: |
          mkdir -p evidence
          for i in 1 2 3 4 5; do
            python -m textforensics.cli report --file testdata/sample.txt --output evidence/trust_run_$i.json
          done
        shell: bash
    
      - name: Verify Trust Map determinism
        id: trust_check
        run: |
          echo "Verifying Trust Map determinism..."
          # Extract trust_map from each run (excluding generated_at_utc)
          for i in 1 2 3 4 5; do
            jq 'del(.generated_at_utc) | .trust_map' evidence/trust_run_$i.json > evidence/trust_map_run_$i.json
          done
          
          HASH1=$(sha256sum evidence/trust_map_run_1.json | cut -d' ' -f1)
          ALL_MATCH=true
          
          for i in 2 3 4 5; do
            HASH=$(sha256sum evidence/trust_map_run_$i.json | cut -d' ' -f1)
            if [ "$HASH" != "$HASH1" ]; then
              echo "✗ Trust Map run $i differs from run 1"
              echo "Run 1: $HASH1"
              echo "Run $i: $HASH"
              diff evidence/trust_map_run_1.json evidence/trust_map_run_$i.json || true
              ALL_MATCH=false
            fi
          done
          
          if [ "$ALL_MATCH" = "true" ]; then
            echo "TRUST_DETERMINISTIC=true" >> $GITHUB_OUTPUT
            echo "✓ Trust Map is deterministic"
          else
            echo "TRUST_DETERMINISTIC=false" >> $GITHUB_OUTPUT
            echo "✗ Trust Map outputs differ!"
            exit 1
          fi
        shell: bash
    
      - name: Upload Trust Map evidence
        uses: actions/upload-artifact@v4
        with:
          name: trust-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: evidence/
          retention-days: 30

  reproducibility-summary:
    name: Reproducibility Summary
    runs-on: ubuntu-latest
    needs: [build-reproducibility, cli-determinism, case-file-determinism, detector-determinism, trust-map-determinism]
    if: always()
    
    steps:
      - name: Check all job results
        run: |
          echo "=== Reproducibility Workflow Summary ==="
          echo ""
          echo "Build Reproducibility: ${{ needs.build-reproducibility.result }}"
          echo "CLI Determinism: ${{ needs.cli-determinism.result }}"
          echo "Case File Determinism: ${{ needs.case-file-determinism.result }}"
          echo "Detector Determinism: ${{ needs.detector-determinism.result }}"
          echo "Trust Map Determinism: ${{ needs.trust-map-determinism.result }}"
          echo ""
          
          if [ "${{ needs.build-reproducibility.result }}" = "success" ] && \
             [ "${{ needs.cli-determinism.result }}" = "success" ] && \
             [ "${{ needs.case-file-determinism.result }}" = "success" ] && \
             [ "${{ needs.detector-determinism.result }}" = "success" ] && \
             [ "${{ needs.trust-map-determinism.result }}" = "success" ]; then
            echo "✓ All reproducibility checks passed!"
            exit 0
          else
            echo "✗ Some reproducibility checks failed!"
            exit 1
          fi
