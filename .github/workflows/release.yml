name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release test environment
        run: python -m pip install -e ".[dev,all]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Resolve isolated runtime dependency set
        run: |
          python -m venv .runtime-audit
          .runtime-audit/bin/python -m pip install ".[all]"
          .runtime-audit/bin/python -m pip check
          .runtime-audit/bin/python -m pip freeze             | grep -viE '^textforensics([= @]|$)'             > runtime-requirements.txt
          test -s runtime-requirements.txt
          ! grep -qiE '^textforensics([= @]|$)' runtime-requirements.txt

      - name: Audit runtime dependencies and generate SBOM
        run: |
          python -m pip install pip-audit
          pip-audit --strict --no-deps -r runtime-requirements.txt
          pip-audit --no-deps -r runtime-requirements.txt             --format cyclonedx-json             --output dist/runtime-dependencies.cdx.json

      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: textforensics-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
