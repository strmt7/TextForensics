name: Full model adapter smoke

on:
  push:
    paths:
      - "src/textforensics/detector_desklib.py"
      - "src/textforensics/detectors.py"
      - "pyproject.toml"
      - ".github/workflows/model-adapter.yml"
  pull_request:
    paths:
      - "src/textforensics/detector_desklib.py"
      - "src/textforensics/detectors.py"
      - "pyproject.toml"
      - ".github/workflows/model-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desklib-cpu:
    name: Desklib pinned-model CPU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
      TOKENIZERS_PARALLELISM: "false"
      TEXTFORENSICS_DESKLIB_DEVICE: "cpu"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install detector extra
        run: python -m pip install -e ".[desklib]"

      - name: Dependency consistency
        run: python -m pip check

      - name: Adapter unit tests
        run: python -m unittest tests.test_desklib -v

      - name: Download pinned weights and execute real inference
        run: |
          python - <<'PY'
          from textforensics.detector_desklib import (
              MODEL_ID,
              MODEL_REVISION,
              DesklibDetector,
          )

          text = """
          I repeated the measurements on Tuesday because the first run looked
          inconsistent. I replaced one cable, let the enclosure cool for twenty
          minutes, and then collected three additional traces. The second and
          third traces agreed closely, while the fourth drifted after the heater
          was switched on. I wrote the values in my notebook before changing
          anything else, because I wanted to preserve the sequence of events.
          The result does not yet establish the cause of the drift. Tomorrow I
          plan to repeat the same sequence with the fan speed fixed and the
          enclosure temperature logged independently. If the offset appears
          again only after heating, I will inspect the connector and repeat the
          calibration before changing the sensor.
          """

          detector = DesklibDetector(device="cpu", min_words=40)
          result = detector.detect(text)
          assert result.detector_id == MODEL_ID
          assert result.detector_version.endswith(MODEL_REVISION[:12])
          assert result.score is not None
          assert 0.0 <= result.score <= 1.0
          assert result.verdict in {"ai_like", "human_like"}
          assert result.calibrated_ai_probability is None
          assert result.calibration_id is None
          print(
              {
                  "detector_id": result.detector_id,
                  "detector_version": result.detector_version,
                  "native_score": result.score,
                  "verdict": result.verdict,
              }
          )
          PY
