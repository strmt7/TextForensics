        run: |
          mkdir -p artifacts/trust/{crashes,corpus,coverage}
          timeout 300 python -c "
          import sys
          import atheris
          sys.path.insert(0, 'src')
          from tests.fuzz.fuzz_trust_map import TestOneInput
          atheris.Setup(sys.argv + ['-runs=0'], TestOneInput)
          atheris.Fuzz()
          " || true

      - name: Run casefile/benchmark JSON parsing fuzz
        env:
          FUZZ_DURATION: 300
        run: |
          mkdir -p artifacts/casefile/{crashes,corpus,coverage}
          timeout 300 python -c "
          import sys
          import atheris
          sys.path.insert(0, 'src')
          from tests.fuzz.fuzz_json_parsing import TestOneInput
          atheris.Setup(sys.argv + ['-runs=0'], TestOneInput)
          atheris.Fuzz()
          " || true

      - name: Upload crash artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.version }}-other
          path: |
            artifacts/schema/crashes/
            artifacts/trust/crashes/
            artifacts/casefile/crashes/
          retention-days: 30
          if-no-files-found: ignore

  fuzz-summary:
    name: Fuzz Summary
    runs-on: ubuntu-latest
    needs: [fuzz-json-parsing, fuzz-text-input, fuzz-detector, fuzz-provenance, fuzz-other]
    if: always()
    steps:
      - name: Check and report results
        run: |
          echo "Fuzz testing completed for all targets and Python versions (3.11, 3.12, 3.13)"
          echo ""
          echo "Artifacts uploaded:"
          echo "  - fuzz-crashes-*-json-parsing"
          echo "  - fuzz-crashes-*-text-input"
          echo "  - fuzz-crashes-*-detector"
          echo "  - fuzz-crashes-*-ledger"
          echo "  - fuzz-crashes-*-other (schema, trust, casefile)"
          echo ""
          echo "Check artifacts for crashes and corpus data with 30-day retention."