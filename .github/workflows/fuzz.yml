# Fuzz testing workflow for TextForensics using atheris + LibFuzzer.
#
# Modes:
#   Push  (regression) - replay existing corpus to catch regressions
#   Weekly (Saturday 03:00 UTC) - extend corpus with new findings
#   Manual dispatch - configurable duration

name: Fuzz Testing

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/fuzz/**'
      - 'scripts/run_fuzz.py'
      - 'pyproject.toml'
  schedule:
    - cron: '0 3 * * 6'  # Weekly on Saturday at 03:00 UTC — extended corpus exploration
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration in minutes per target'
        required: false
        default: '10'
        type: string
      method:
        description: 'Run method (pytest or direct atheris)'
        required: false
        default: 'pytest'
        type: choice
        options:
          - pytest
          - direct

concurrency:
  group: fuzz-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  fuzz-regression:
    name: Fuzz Regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check atheris availability
        id: atheris
        run: |
          if python -c "import atheris" 2>/dev/null; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::atheris not available for Python ${{ matrix.python-version }}, falling back to pytest mode"
          fi

      - name: Run fuzz regression (pytest)
        if: steps.atheris.outputs.available == 'false' || github.event_name == 'push'
        run: |
          python -m pytest tests/fuzz/test_fuzz_pytest.py -v --tb=short

      - name: Run fuzz regression (direct atheris, 5 min)
        if: steps.atheris.outputs.available == 'true' && github.event_name == 'push'
        run: |
          mkdir -p artifacts/fuzz
          python scripts/run_fuzz.py --method direct --duration 5 --regression || true
          echo "::group::Crash artifacts"
          find artifacts/fuzz -type f -not -name '.gitkeep' 2>/dev/null | head -20 || echo "No crash artifacts"
          echo "::endgroup::"

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-py${{ matrix.python-version }}
          path: artifacts/fuzz/
          retention-days: 14
          if-no-files-found: ignore

  fuzz-weekly:
    name: Fuzz Extended (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate initial corpus
        run: |
          python tests/fuzz/generate_corpus.py --output-dir tests/fuzz/corpus || true

      - name: Run extended fuzz (direct atheris)
        env:
          FUZZ_DURATION: ${{ github.event.inputs.duration || '10' }}
        run: |
          DURATION=${{ github.event.inputs.duration || '10' }}
          METHOD=${{ github.event.inputs.method || 'direct' }}
          echo "Running fuzz with duration=${DURATION}min method=${METHOD}"
          python scripts/run_fuzz.py --method "$METHOD" --duration "$DURATION" || true

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-weekly-py${{ matrix.python-version }}
          path: artifacts/fuzz/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload new corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-weekly
          path: artifacts/fuzz/*/corpus/
          retention-days: 30
          if-no-files-found: ignore

  fuzz-summary:
    name: Fuzz Summary
    runs-on: ubuntu-latest
    needs: [fuzz-regression]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Report results
        run: |
          echo "Fuzz testing completed."
          echo ""
          echo "Artifacts (14-day retention):"
          echo "  - fuzz-crashes-py3.11"
          echo "  - fuzz-crashes-py3.12"
          echo "  - fuzz-crashes-py3.13"
          echo ""
          echo "Check artifacts for crash input files. Reproduce locally with:"
          echo "  python scripts/run_fuzz.py --target <name> --method direct"
