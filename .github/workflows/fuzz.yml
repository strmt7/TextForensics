          ls -la artifacts/text_input/crashes/ 2>/dev/null || echo "No crashes found"

      - name: Upload crash artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.version }}-text-input
          path: artifacts/text_input/crashes/
          retention-days: 30
          if-no-files-found: ignore

  fuzz-detector:
