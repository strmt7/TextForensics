# Fuzz testing workflow for TextForensics using atheris
# Runs coverage-guided fuzzing on critical input processing paths

name: Fuzz Testing

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/fuzz/**'
  schedule:
    # Weekly on Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzz duration in minutes per target'
        required: false
        default: '5'
        type: string

concurrency:
  group: fuzz-${{ github.sha }}
  cancel-in-progress: false

jobs:
  fuzz-json-parsing:
    name: Fuzz JSON Parsing (Python ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          cache: pip

      - name: Install atheris
        run: |
          python -m pip install --upgrade pip
          pip install atheris -U

      - name: Run JSON parsing fuzz
        env:
          FUZZ_DURATION: 300
        run: |
          mkdir -p artifacts/json_parsing/{crashes,corpus,coverage}
          timeout 300 python -c "
          import sys
          import atheris
          sys.path.insert(0, 'src')
          from tests.fuzz.fuzz_json_parsing import TestOneInput
          atheris.Setup(sys.argv + ['-runs=0'], TestOneInput)
          atheris.Fuzz()
          " || true
          ls -la artifacts/json_parsing/crashes/ 2>/dev/null || echo "No crashes found"

      - name: Upload crash artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.version }}-json-parsing
          path: artifacts/json_parsing/crashes/
          retention-days: 30
          if-no-files-found: ignore

  fuzz-text-input:
    name: Fuzz Text Input Validation (Python ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
          cache: pip

      - name: Install atheris
        run: |
          python -m pip install --upgrade pip
          pip install atheris -U

      - name: Install textforensics
        run: |
          pip install -e .
          pip install -e '.[dev]'

      - name: Run text input validation fuzz
        env:
          FUZZ_DURATION: 300
        run: |
          mkdir -p artifacts/text_input/{crashes,corpus,coverage}
          timeout 300 python -c "
