name: Enterprise Deep Verification

# Deep verification workflow for TextForensics - runs weekly and on-demand
# Modeled after rejection-rejector's enterprise-deep-verification.yml

on:
  schedule:
    - cron: "0 2 * * 1" # Weekly Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-deep-verification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # 1. FULL TEST SUITE WITH PYTEST ALL FEATURES
  # ==========================================================================
  test-suite-all-features:
    name: Full Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install development dependencies with all features
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e ".[dev,api,mcp,security]"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      # ENG-07: the full suite runs unexcluded. The old
      # `--ignore=tests/test_docs.py` excluded a passing test file
      # from the suite (CI Core already runs it green); excluding
      # test files is not how coverage is repaired.
      - name: Run full pytest suite
        id: test-results
        run: |
          set -o pipefail
          pytest tests \
            -v \
            --tb=short \
            --strict-markers \
            -W error \
            2>&1 | tee "${RUNNER_TEMP}/pytest-output.log"

      - name: Upload test artifacts on failure
        if: failure() || steps.test-results.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-log-py${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/pytest-output.log
          if-no-files-found: warn
          retention-days: 30

  # ==========================================================================
  # 2. CODE COVERAGE VERIFICATION
  # ==========================================================================
  coverage-verification:
    name: Code Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install with coverage support
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e ".[dev]"

      - name: Run tests with coverage
        # ENG-07: no --ignore here either (see the full-suite job):
        # the coverage run measures the whole suite, test_docs.py
        # included.
        run: |
          coverage run -m pytest tests

      - name: Generate coverage report with thresholds
        # Gate 75%: this job installs `.[dev]` only (core-only), so it
        # measures core-only coverage, NOT the ~81% extras-venv figure.
        # Measured core-only coverage is 78.50% on e65fde9 (Python 3.12,
        # fresh bare venv, `pip install -e ".[dev]"`, full suite), 78.43%
        # on 928dbc0 and 76.95% on a1e7857 — the same basis as the CI
        # Core gate (ci.yml --fail-under=75). 95% was never achievable
        # on this job; 75% leaves ~3.5pp margin for cross-version
        # variance (3.11-3.15) and tree growth.
        run: |
          coverage report \
            --fail-under=75 \
            --show-missing

      - name: Coverage XML for archive
        run: coverage xml -o coverage.xml

      - name: Coverage JSON for analysis
        run: coverage json -o coverage.json

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            coverage.xml
            coverage.json
          retention-days: 30

  # ==========================================================================
  # 3. DOCUMENTATION BUILD AND LINK CHECKING
  # ==========================================================================
  documentation-verification:
    name: Documentation Build & Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e ".[dev]"
          # Docs tools (myst-parser, sphinx, sphinx-rtd-theme) are
          # hash-pinned in requirements-tools-hashed.txt. NOTE:
          # sphinx-linkcheck was REMOVED from the install list — no such
          # package exists on PyPI (404); linkcheck is a built-in Sphinx
          # builder, not an installable package, so the old line could
          # never succeed.
          python -m pip install --require-hashes -r requirements-tools-hashed.txt

      - name: Check README renderability
        run: |
          python -c "import markdown; markdown.markdown(open('README.md').read())"

      - name: Build documentation
        # ENG-07: the old `if [ -d "docs" ]` guard made this step
        # succeed doing nothing when docs/ was absent. docs/ is a
        # required input: its absence fails, and the build must
        # produce HTML files (an empty build is not a pass).
        run: |
          test -d docs || { echo "::error::docs/ directory is missing; cannot build documentation."; exit 1; }
          mkdir -p docs/_build
          sphinx-build -b html docs docs/_build/html
          HTML_COUNT=$(find docs/_build/html -name '*.html' | wc -l)
          echo "Built HTML files: $HTML_COUNT"
          test "$HTML_COUNT" -gt 0 || { echo "::error::sphinx-build produced no HTML files."; exit 1; }

      - name: Verify schema documentation
        run: |
          python -c "
          import json
          from pathlib import Path
          schemas = Path('src/textforensics/schemas')
          files = sorted(schemas.glob('*.json'))
          # ENG-07: an empty glob used to pass vacuously (zero files
          # validated). At least one schema must be validated.
          assert files, 'no schema files found under src/textforensics/schemas'
          for schema_file in files:
              with open(schema_file) as f:
                  data = json.load(f)
              assert '\$schema' in data or 'schema' in data or 'type' in data, f'Missing schema key in {schema_file}'
              print(f'Validated: {schema_file.name}')
          print(f'Validated {len(files)} schema files')
          "

      - name: Upload docs artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: documentation-${{ github.sha }}
          # ENG-07: the old upload named coverage.json, a file this
          # job never produces (a different job does). Upload the
          # HTML this job built; a missing build fails the upload.
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 30

  # ==========================================================================
  # 4. DEPENDENCY VULNERABILITY AUDIT WITH ZERO TOLERANCE
  # ==========================================================================
  vulnerability-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated audit environment
        run: |
          python -m venv .audit-env

      - name: Install all dependencies
        run: |
          .audit-env/bin/python -m pip install --require-hashes -r requirements-hashed.txt
          .audit-env/bin/python -m pip install --no-deps -e ".[dev,api,mcp,security]"

      - name: Resolve runtime dependencies
        run: |
          .audit-env/bin/python -m pip freeze | grep -viE '(^textforensics([= @]|$)|#egg=textforensics)' > audit-requirements.txt
          # ENG-07/ENG-11: an empty freeze file would make pip-audit
          # report zero findings for zero packages and pass. The
          # audit input must be non-empty and counted.
          COUNT=$(wc -l < audit-requirements.txt)
          echo "audit-requirements.txt: $COUNT packages"
          test "$COUNT" -gt 0 || { echo "::error::audit-requirements.txt is empty; nothing would be audited."; exit 1; }

      - name: Run pip-audit with zero tolerance
        run: |
          # pip-audit and bandit come from the hash-pinned lockfile
          # installed above (pip-audit 2.10.1, bandit 1.9.4).

          # Strict dependency audit - fail on any vulnerability.
          # JSON output is kept so the next step can validate audit
          # COVERAGE (ENG-11): --strict fails on findings, but a
          # skipped package would still read as zero findings.
          .audit-env/bin/pip-audit --strict --no-deps -r audit-requirements.txt \
            --format json -o pip-audit-deep.json

      - name: Validate pip-audit coverage
        # ENG-11: every package in pip-audit-deep.json must be in a
        # known coverage state (audited/skipped/unresolved, counts
        # reconciling); an unrecorded skip or an unresolved package
        # fails this step (scripts/check_pip_audit.py --from-json).
        run: |
          python scripts/check_pip_audit.py --from-json pip-audit-deep.json

      - name: Run bandit security scan
        # ENG-07: bandit used to run in the same step as pip-audit,
        # so a pip-audit failure masked the bandit result entirely.
        # It runs as its own step so both scans gate independently.
        run: |
          .audit-env/bin/bandit -r src -ll -ii

      - name: Generate SBOM for audit
        run: |
          # cyclonedx-bom (8.0.1) is hash-pinned in
          # requirements-tools-hashed.txt; it is NOT in the main lockfile.
          .audit-env/bin/python -m pip install --require-hashes -r requirements-tools-hashed.txt
          .audit-env/bin/cyclonedx-py requirements \
            --pyproject pyproject.toml \
            audit-requirements.txt \
            --of JSON -o sbom-audit.json

      - name: Upload vulnerability scan artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vulnerability-audit-${{ github.sha }}
          path: |
            audit-requirements.txt
            pip-audit-deep.json
            sbom-audit.json
          retention-days: 30

  # ==========================================================================
  # 5. RELEASE PROVENANCE VERIFICATION (SBOM, SIGNATURES)
  # ==========================================================================
  release-provenance:
    name: Release Provenance Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        # build (1.6.1) and twine (7.0.0) come from the hash-pinned
        # lockfile; no separate install line is needed.
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt

      - name: Build distributions
        run: python -m build

      - name: Validate distribution integrity
        # ENG-07: this step used to be named "Validate distribution
        # signatures" while verifying no signature (cosign/sigstore
        # verification is the repository-integrity job's work). It
        # validates twine integrity and verifies the checksums it
        # generates — a checksum file that is never verified proves
        # nothing.
        run: |
          # Verify distribution integrity with twine
          twine check dist/*

          # Generate checksums
          sha256sum dist/* > dist/SHA256SUMS
          cat dist/SHA256SUMS

          # Verify the checksums just generated.
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0 (2026-03-19 tip, Syft v1.42.3)
        with:
          path: dist
          format: syft-json
          output-file: sbom-release.json

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile
          import hashlib

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()

          # Verify schema inclusion
          assert any(name.endswith("schemas/case-file.schema.json") for name in names), "case-file schema missing"
          assert any(name.endswith("schemas/detector-result.schema.json") for name in names), "detector-result schema missing"
          assert any(name.endswith("schemas/forensic-bundle.schema.json") for name in names), "forensic-bundle schema missing"
          assert any("/licenses/LICENSE" in name for name in names), "LICENSE missing"

          # Verify checksums file exists
          with open("dist/SHA256SUMS") as f:
              checksums = f.read()
          assert len(checksums) > 0, "Checksums file empty"
          print("Wheel validation passed")
          PY

      - name: Upload provenance artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance-${{ github.sha }}
          path: |
            dist/
            sbom-release.json
          retention-days: 30

  # ==========================================================================
  # 6. SCHEMA VALIDATION
  # ==========================================================================
  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # ENG-07(2): the project itself must be installed before any step
      # imports `textforensics`; the old job installed only jsonschema
      # and then imported a `CaseFile` symbol that does not exist
      # (`ImportError: cannot import name 'CaseFile' from
      # 'textforensics.casefile'`).
      - name: Install jsonschema and the project
        # jsonschema (4.26.0) comes from the hash-pinned lockfile.
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e ".[dev]"

      - name: Validate all schemas are valid JSON Schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schemas_dir = Path('src/textforensics/schemas')
          schema_files = sorted(schemas_dir.glob('*.json'))
          # ENG-07: an empty glob used to pass vacuously (zero files
          # validated). At least one schema must be validated, and the
          # validated list is written to the report file the upload
          # step below attaches (it used to upload a file no step
          # created).
          assert schema_files, 'no schema files found under src/textforensics/schemas'
          lines = []
          for schema_file in schema_files:
              with open(schema_file) as f:
                  schema = json.load(f)

              # Validate schema structure
              jsonschema.Draft202012Validator.check_schema(schema)
              print(f"✓ {schema_file.name} is valid JSON Schema")
              lines.append(f"{schema_file.name}: valid JSON Schema")

              # Check for required fields
              if '$id' in schema or 'title' in schema:
                  print(f"  → Has identification/metadata")
              if 'properties' in schema:
                  print(f"  → Has {len(schema['properties'])} properties")
              if 'required' in schema:
                  print(f"  → Has {len(schema['required'])} required fields")
          Path('schemas-validation-report.txt').write_text(
              f"Validated {len(schema_files)} schema files\n" + "\n".join(lines) + "\n",
              encoding='utf-8',
          )
          PY

      - name: Test schema instances against schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from textforensics.schema import load_schema, validate_case_file
          from textforensics.casefile import build_checklist

          # Verify CaseFile schema load
          case_schema = load_schema('case-file')
          assert case_schema['type'] == 'object', "CaseFile schema type mismatch"
          print("✓ CaseFile schema loads correctly")

          detector_schema = load_schema('detector-result')
          assert detector_schema['type'] == 'object', "DetectorResult schema type mismatch"
          print("✓ DetectorResult schema loads correctly")

          bundle_schema = load_schema('forensic-bundle')
          assert bundle_schema['type'] == 'object', "ForensicBundle schema type mismatch"
          print("✓ ForensicBundle schema loads correctly")

          # Exercise the real case-file validation entry point: the
          # casefile module exposes build_checklist / validate_case_file
          # (via textforensics.schema), not a `CaseFile` class.
          assert callable(validate_case_file), "validate_case_file missing"
          assert callable(build_checklist), "build_checklist missing"
          print("✓ Case-file validation entry points resolve")
          PY

      - name: Upload schema validation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-validation-${{ github.sha }}
          path: schemas-validation-report.txt
          retention-days: 30
          # ENG-07: the old upload used if-no-files-found: warn on a
          # file no step created. The file is now written by the
          # validation step above; a missing report fails the upload.
          if-no-files-found: error

  # ==========================================================================
  # 7. CLI SMOKE TESTS ACROSS ALL COMMANDS
  # ==========================================================================
  cli-smoke-tests:
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e .

      - name: Test version command
        run: |
          textforensics --version
          textforensics --help

      - name: Test scan command
        run: |
          echo "Testing basic scan..." | textforensics scan --json > scan-output.json
          python -c "import json; data = json.load(open('scan-output.json')); assert 'schema' in data or 'verdict' in data"

      - name: Test report command
        run: |
          textforensics report --help
          printf 'I wrote this text myself after testing the system yesterday.' | textforensics report --json > report-output.json
          python -c "import json; data = json.load(open('report-output.json')); assert 'verdict' in data or 'trust_map' in data"

      - name: Test compare command
        # ENG-07: `compare` EXISTS (src/textforensics/cli.py), so the
        # old `|| echo "compare command not available"` masked a
        # broken compare command as "not available". It runs plainly
        # now: a failing --help fails the job.
        run: |
          textforensics compare --help

      - name: Test CLI with various options
        run: |
          # Test JSON output
          printf 'Test text for verification.' | textforensics scan --json
          # Test with config
          printf 'Another test.' | textforensics scan --config default

      - name: Upload CLI test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cli-smoke-py${{ matrix.python-version }}-${{ github.sha }}
          path: |
            scan-output.json
            report-output.json
          retention-days: 30

  # ==========================================================================
  # 8. API CONTRACT TESTING
  # ==========================================================================
  api-contract-testing:
    name: API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install API dependencies
        # httpx (0.28.1) comes from the hash-pinned lockfile.
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e ".[dev,api]"

      - name: Test API import and instantiation
        run: |
          python -c "from textforensics.api import create_app; app = create_app(); assert app is not None"

      - name: Test API endpoints contract
        run: |
          python - <<'PY'
          import json
          from fastapi.testclient import TestClient
          from textforensics.api import create_app

          app = create_app()
          client = TestClient(app)

          # Test root endpoint
          response = client.get("/")
          assert response.status_code == 200, f"Root failed: {response.status_code}"

          # Test health endpoint
          response = client.get("/healthz")
          assert response.status_code == 200, f"Health check failed: {response.status_code}"

          # Test scan endpoint
          response = client.post("/v1/scan", json={"text": "test text"})
          assert response.status_code == 200, f"Scan failed: {response.status_code}"

          # Test report endpoint
          response = client.post("/v1/report", json={"text": "test report text"})
          assert response.status_code == 200, f"Report failed: {response.status_code}"
          data = response.json()
          assert "verdict" in data or "trust_map" in data, "Missing expected fields"

          # Verify response schema
          assert "schema" in data.get("input", {}) or "input_hash" in data

          print("All API contract tests passed")
          with open("api-contract-report.txt", "w", encoding="utf-8") as report:
              report.write("API contract tests passed\n")
              report.write("endpoints: / /healthz /v1/scan /v1/report\n")
          PY

      - name: Upload API test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-contract-${{ github.sha }}
          path: api-contract-report.txt
          retention-days: 30
          # ENG-07: the file is written by the contract step above; a
          # missing report fails the upload instead of warning.
          if-no-files-found: error

  # ==========================================================================
  # 9. PERFORMANCE BENCHMARKS
  # ==========================================================================
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # pytest-benchmark (5.3.1) comes from the hash-pinned lockfile.
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e ".[dev]"

      - name: Run performance benchmarks
        run: |
          python - <<'PY'
          import time
          import json
          from textforensics.engine import Engine
          from textforensics.config import Config

          engine = Engine()
          config = Config()

          # Benchmark text analysis
          test_text = "This is a test sentence for performance measurement." * 50

          start = time.perf_counter()
          result = engine.analyze(test_text, config)
          elapsed = time.perf_counter() - start

          print(f"Analysis time: {elapsed:.4f}s for {len(test_text)} chars")

          # Performance thresholds (seconds)
          max_time_per_1k_chars = 0.5
          actual_time = elapsed / (len(test_text) / 1000)
          print(f"Time per 1000 chars: {actual_time:.4f}s")

          benchmark_data = {
              "text_length": len(test_text),
              "analysis_time_seconds": elapsed,
              "time_per_1k_chars": actual_time,
              "max_allowed_time_per_1k": max_time_per_1k_chars,
              "passed": actual_time <= max_time_per_1k_chars
          }

          with open("benchmark-results.json", "w") as f:
              json.dump(benchmark_data, f, indent=2)

          # ENG-07: the old code printed WARNING and exited 0 when the
          # threshold failed, so a performance regression read as a
          # green benchmark. A threshold breach fails the job. (The
          # 0.5s/1k-chars value itself is unchanged — it is an audit
          # contract, not a tuned value.)
          if not benchmark_data["passed"]:
              raise SystemExit(
                  f"Performance threshold breached: {actual_time:.4f}s per "
                  f"1000 chars exceeds {max_time_per_1k_chars}s"
              )
          PY

      - name: Store benchmark comparison
        run: |
          echo "# Performance Benchmark Results" > benchmark-report.md
          echo "" >> benchmark-report.md
          python -c "import json; data = json.load(open('benchmark-results.json')); print(json.dumps(data, indent=2))" >> benchmark-report.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-benchmarks-${{ github.sha }}
          path: |
            benchmark-results.json
            benchmark-report.md
          retention-days: 30

  # ==========================================================================
  # 10. CROSS-PLATFORM VERIFICATION MATRIX
  # ==========================================================================
  cross-platform-verification:
    name: Cross-Platform Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest]  # Primary platform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify Linux platform
        run: |
          python -c "import sys; print(f'Platform: {sys.platform}')"
          uname -a

      - name: Install and test
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e ".[dev]"
          textforensics --version

  # Cross-platform jobs for other OSes
  cross-platform-windows:
    name: Cross-Platform - Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Windows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python Windows
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install and test Windows
        # ENG-07: Git Bash (not PowerShell) so a failing install fails
        # the step instead of being masked — the same false-pass
        # pattern B4 fixed in ci.yml's os-smoke job.
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e ".[dev]"
          textforensics --version > windows-verification.txt
          cat windows-verification.txt

      - name: Upload Windows verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-platform-windows-${{ github.sha }}
          path: windows-verification.txt
          retention-days: 30
          # ENG-07: the file is written by the step above; a missing
          # verification file fails the upload instead of warning.
          if-no-files-found: error

  cross-platform-macos:
    name: Cross-Platform - macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout macOS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python macOS
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install and test macOS
        run: |
          python -m pip install --require-hashes -r requirements-hashed.txt
          python -m pip install --no-deps -e ".[dev]"
          textforensics --version > macos-verification.txt
          cat macos-verification.txt

      - name: Upload macOS verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-platform-macos-${{ github.sha }}
          path: macos-verification.txt
          retention-days: 30
          # ENG-07: the file is written by the step above; a missing
          # verification file fails the upload instead of warning.
          if-no-files-found: error

  # ==========================================================================
  # VERIFICATION SUMMARY
  # ==========================================================================
  verification-summary:
    name: Verification Summary Report
    # ENG-07: the cross-platform jobs used to be claimed "Completed"
    # in the summary without being in `needs` at all — their results
    # were never consulted. They are required here, and the summary
    # fails when any required job did not succeed.
    needs: [test-suite-all-features, coverage-verification, documentation-verification, vulnerability-audit, release-provenance, schema-validation, cli-smoke-tests, api-contract-testing, performance-benchmarks, cross-platform-verification, cross-platform-windows, cross-platform-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate verification summary
        run: |
          # ENG-07: the old summary printed "Completed" for every job
          # unconditionally, including jobs that had failed or never
          # ran. Statuses below are the real needs.*.result values,
          # and any non-success fails this job.
          {
            echo "============================================================"
            echo "TEXTFORENSICS ENTERPRISE DEEP VERIFICATION REPORT"
            echo "============================================================"
            echo "SHA: ${{ github.sha }}"
            echo "Run ID: ${{ github.run_id }}"
            echo "Run Number: ${{ github.run_number }}"
            echo "Event: ${{ github.event_name }}"
            echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo ""
            echo "VERIFICATION JOB RESULTS:"
            echo "- test-suite-all-features: ${{ needs.test-suite-all-features.result }}"
            echo "- coverage-verification: ${{ needs.coverage-verification.result }}"
            echo "- documentation-verification: ${{ needs.documentation-verification.result }}"
            echo "- vulnerability-audit: ${{ needs.vulnerability-audit.result }}"
            echo "- release-provenance: ${{ needs.release-provenance.result }}"
            echo "- schema-validation: ${{ needs.schema-validation.result }}"
            echo "- cli-smoke-tests: ${{ needs.cli-smoke-tests.result }}"
            echo "- api-contract-testing: ${{ needs.api-contract-testing.result }}"
            echo "- performance-benchmarks: ${{ needs.performance-benchmarks.result }}"
            echo "- cross-platform-verification: ${{ needs.cross-platform-verification.result }}"
            echo "- cross-platform-windows: ${{ needs.cross-platform-windows.result }}"
            echo "- cross-platform-macos: ${{ needs.cross-platform-macos.result }}"
            echo ""
            echo "This file serves as evidence of comprehensive verification."
            echo "============================================================"
          } > verification-summary-${{ github.sha }}.txt
          cat verification-summary-${{ github.sha }}.txt
          FAILED=0
          for RESULT in \
            "${{ needs.test-suite-all-features.result }}" \
            "${{ needs.coverage-verification.result }}" \
            "${{ needs.documentation-verification.result }}" \
            "${{ needs.vulnerability-audit.result }}" \
            "${{ needs.release-provenance.result }}" \
            "${{ needs.schema-validation.result }}" \
            "${{ needs.cli-smoke-tests.result }}" \
            "${{ needs.api-contract-testing.result }}" \
            "${{ needs.performance-benchmarks.result }}" \
            "${{ needs.cross-platform-verification.result }}" \
            "${{ needs.cross-platform-windows.result }}" \
            "${{ needs.cross-platform-macos.result }}"; do
            if [ "$RESULT" != "success" ]; then FAILED=1; fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::One or more verification jobs did not succeed; see the summary above."
            exit 1
          fi
          echo "All verification jobs succeeded."

      - name: Upload verification summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-summary-${{ github.sha }}
          path: verification-summary-${{ github.sha }}.txt
          retention-days: 30
