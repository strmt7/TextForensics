name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Raised 15 -> 30 on 2026-11-08: the full suite (pre-commit,
    # compileall, ruff, pytest under coverage, golden-file verification,
    # pip check, CLI smoke, coverage) outgrew the 15-minute cap — all
    # five Core jobs were cancelled at ~15m16s on run 42485688136
    # (head 2e28466), with the same deterioration all day
    # (09:15: 3.13/3.14 only; 12:02: 3.15 only; 12:40: 3.12 only).
    # Not a code failure: every other job on that head was green.
    # 3.11 is slower than the rest: on runs 42491772929 and
    # 42496108465 the other four Pythons passed in 13–20 minutes while
    # 3.11 alone hit the 30-minute cap (30m19s), its uploaded log
    # ending mid-run at ~69% with no failure — the suite itself is
    # slow on 3.11, not setup. 3.11 therefore gets 45 minutes; the
    # rest stay at 30. If 3.11 still exceeds 45, the always-uploaded
    # test log will show whether it is the suite or pre-commit/install.
    timeout-minutes: ${{ matrix.python-version == '3.11' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    permissions:
      contents: read # checkout
      actions: write # pip cache + failure-artifact upload
      id-token: write # Codecov OIDC upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pre-commit hooks
        run: pre-commit run --all-files
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Lint critical errors
        run: ruff check src tests
      - name: Unit tests
        run: |
          set -o pipefail
          coverage run --source=textforensics -m pytest tests -q --tb=short 2>&1 | tee "$RUNNER_TEMP/unittest-py$PYTHON_VERSION.log"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
      - name: Golden file verification
        run: python scripts/verify_golden.py
      - name: Dependency consistency
        run: python -m pip check
      - name: CLI smoke
        run: textforensics --version
      - name: Coverage report
        run: coverage report --fail-under=70
      - name: Coverage XML
        run: coverage xml -o coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          use_oidc: true
          name: textforensics
          fail_ci_if_error: true
      - name: Upload test log on failure
        # always(): cancelled (timeout) jobs previously uploaded no log,
        # so the slow step inside the Core job could not be diagnosed.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unittest-log-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/unittest-py${{ matrix.python-version }}.log
          if-no-files-found: warn
          retention-days: 7

  claims-gate:
    name: Claims-to-evidence gate (U7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,api,mcp,security]"
      - name: Run claims gate
        run: python scripts/check_claims.py
      - name: Report card is up to date
        run: git diff --exit-code -- docs/evidence/report-card.md

  pinned:
    name: Pinned requirements install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install from requirements-pinned.txt
        run: python -m pip install -r requirements-pinned.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: CLI smoke
        run: textforensics --version

  os-smoke:
    name: OS smoke ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[enterprise]"
      - run: textforensics --version
      - name: JSON CLI smoke
        shell: bash
        run: |
          printf 'I tested this yesterday and wrote down what happened.' | textforensics scan --json > output.json
          python -c "import json; json.load(open('output.json', encoding='utf-8'))"

  package:
    name: Build and wheel-install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "build>=1.2,<2" twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              names = archive.namelist()
          assert any(name.endswith("schemas/case-file.schema.json") for name in names)
          assert any(name.endswith("schemas/detector-result.schema.json") for name in names)
          assert any(name.endswith("schemas/forensic-bundle.schema.json") for name in names)
          assert any("/licenses/LICENSE" in name for name in names), names
          PY
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -m pip check
      - run: textforensics --version
      - name: Verify packaged schemas
        run: python -c "from textforensics.schema import load_schema; assert load_schema('case-file')['type'] == 'object'"

  api:
    name: Optional API surface Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,api]"
      - run: python -m unittest tests.test_api -v
      - run: python -c "from textforensics.api import create_app; assert create_app() is not None"

  mcp:
    name: Optional MCP surface Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[mcp]"
      - run: python -c "from textforensics.mcp_server import _server; assert _server() is not None"
