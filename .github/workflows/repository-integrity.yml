name: Repository Integrity

on:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-integrity-${{ github.sha }}
  cancel-in-progress: false

jobs:
  sigstore:
    name: Sigstore Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify signatures
        run: |
          echo "Verifying release signatures..."
          # This would verify cosign signatures on releases
          echo "Sigstore verification placeholder - requires signed releases"
      - name: Verify attestations
        run: |
          echo "Verifying SLSA attestations..."
          echo "Attestation verification placeholder"

  provenance:
    name: Build Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30
