name: Benchmark

on:
  schedule:
    - cron: "0 6 * * 0" # Weekly Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version to benchmark"
        required: false
        default: "3.12"
        type: choice
        options: ["3.11", "3.12", "3.13", "3.14", "3.15"]
      iterations:
        description: "Number of timing iterations"
        required: false
        default: "5"
        type: string
      include-memory:
        description: "Run memory profiling (slower)"
        required: false
        default: false
        type: boolean
      baseline-ref:
        description: "Git ref for performance baseline comparison (e.g., main, HEAD~1)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '5' }}
      BENCHMARK_INCLUDE_MEMORY: ${{ github.event.inputs.include-memory || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for baseline comparison

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ github.event.inputs.python-version || '3.12' }}
          cache: pip

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"
          python -m pip install memory-profiler

      - name: Run standalone benchmark script
        run: |
          python scripts/benchmark.py \
            --iterations "${{ env.BENCHMARK_ITERATIONS }}" \
            --output benchmark-results.json \
            ${{ env.BENCHMARK_INCLUDE_MEMORY == 'true' && '--measure-memory' || '' }}

      - name: Run pytest-benchmark suite (performance regression tests)
        run: |
          python -m pytest tests/test_performance.py --benchmark-only --benchmark-min-rounds=5 --benchmark-json=pytest-performance.json

      - name: Run legacy pytest-benchmark suite (if available)
        run: |
          if python -c "import pytest_benchmark" 2>/dev/null; then
            python -m pytest tests/test_benchmarks.py --benchmark-only --benchmark-json=pytest-benchmark.json
          else
            echo "pytest-benchmark not installed; running performance assertions instead"
            python -m pytest tests/test_benchmarks.py -v --tb=short
          fi

      # ENG-13: resolve the immutable baseline BEFORE downloading it.
      # Comparison is REQUIRED by default (push/schedule/dispatch):
      # the only legitimate skip is a workflow_dispatch whose
      # baseline-ref input is explicitly empty, and that is reported as
      # status=skipped with a reason — never as a pass. The baseline is
      # the latest successful benchmark run on the resolved ref; its run
      # id is recorded so the comparison is against one immutable run,
      # not "whatever artifact happens to exist". Baselines are
      # published from main runs only (artifact performance-baseline-main);
      # a ref with no successful run (or no such artifact) fails closed.
      - name: Resolve baseline run
        id: resolve-baseline
        run: |
          RAW_REF="${{ github.event.inputs.baseline-ref }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$RAW_REF" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch with empty baseline-ref input (explicit opt-out)" >> "$GITHUB_OUTPUT"
            echo "::warning::Baseline comparison skipped: workflow_dispatch with empty baseline-ref input."
            exit 0
          fi
          REF="${RAW_REF:-main}"
          echo "status=required" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          RUN_ID="$(gh api "repos/${{ github.repository }}/actions/workflows/benchmark.yml/runs?branch=${REF}&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful benchmark run found on ref '${REF}'; cannot resolve an immutable baseline. Run the benchmark workflow on '${REF}' first so a baseline artifact is published."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved baseline: ref=${REF} run_id=${RUN_ID}"

      - name: Download performance baseline for comparison
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (validated: gh api repos/actions/download-artifact/commits/<sha> returns 200)
        with:
          name: performance-baseline-main
          path: baseline/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve-baseline.outputs.run_id }}

      - name: Compare performance against baseline
        run: |
          if [ "${{ steps.resolve-baseline.outputs.status }}" = "skipped" ]; then
            echo "Baseline comparison skipped: ${{ steps.resolve-baseline.outputs.reason }}"
            printf '{"status": "skipped", "reason": "%s", "compared": 0}\n' "${{ steps.resolve-baseline.outputs.reason }}" > comparison-status.json
            exit 0
          fi
          if [ ! -f "baseline/pytest-performance.json" ]; then
            echo "::error::Baseline artifact is missing pytest-performance.json (resolved run ${{ steps.resolve-baseline.outputs.run_id }} on ref ${{ steps.resolve-baseline.outputs.ref }}). Comparison is required and cannot proceed without a baseline."
            printf '{"status": "error", "reason": "baseline artifact missing pytest-performance.json", "run_id": "%s", "ref": "%s", "compared": 0}\n' "${{ steps.resolve-baseline.outputs.run_id }}" "${{ steps.resolve-baseline.outputs.ref }}" > comparison-status.json
            exit 1
          fi
          echo "Comparing against baseline from run ${{ steps.resolve-baseline.outputs.run_id }} (ref ${{ steps.resolve-baseline.outputs.ref }})"
          python -m pytest tests/test_performance.py --benchmark-only --benchmark-min-rounds=5 \
            --benchmark-compare=baseline/pytest-performance.json \
            --benchmark-compare-fail=mean:1.20 \
            --benchmark-json=pytest-performance-comparison.json 2>&1 | tee comparison-output.txt
          COMPARE_EXIT_CODE=${PIPESTATUS[0]}
          printf '{"status": "%s", "run_id": "%s", "ref": "%s"}\n' "$([ "$COMPARE_EXIT_CODE" -eq 0 ] && echo passed || echo failed)" "${{ steps.resolve-baseline.outputs.run_id }}" "${{ steps.resolve-baseline.outputs.ref }}" > comparison-status.json
          if [ $COMPARE_EXIT_CODE -ne 0 ]; then
            echo "::error::Performance regression detected! Results are >20% slower than baseline."
            cat comparison-output.txt
            exit 1
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-py${{ github.event.inputs.python-version || '3.12' }}-${{ github.sha }}
          path: |
            benchmark-results.json
            pytest-benchmark.json
            pytest-performance.json
            pytest-performance-comparison.json
            comparison-status.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload performance baseline (main branch only)
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-baseline-main
          path: pytest-performance.json
          if-no-files-found: warn
          retention-days: 365

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark-results.json ]; then
            echo '### Standalone Benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat benchmark-results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f pytest-performance.json ]; then
            echo '### pytest-benchmark Performance Tests' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat pytest-performance.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f pytest-performance-comparison.json ]; then
            echo '### Performance Comparison (vs baseline)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat pytest-performance-comparison.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Artifacts uploaded with 90-day retention (baseline: 365 days)." >> "$GITHUB_STEP_SUMMARY"
