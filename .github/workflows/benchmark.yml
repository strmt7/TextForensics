name: Benchmark

on:
  schedule:
    - cron: "0 6 * * 0" # Weekly Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version to benchmark"
        required: false
        default: "3.12"
        type: choice
        options: ["3.11", "3.12", "3.13", "3.14", "3.15"]
      iterations:
        description: "Number of timing iterations"
        required: false
        default: "5"
        type: string
      include-memory:
        description: "Run memory profiling (slower)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '5' }}
      BENCHMARK_INCLUDE_MEMORY: ${{ github.event.inputs.include-memory || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ github.event.inputs.python-version || '3.12' }}
          cache: pip

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"
          python -m pip install memory-profiler

      - name: Run standalone benchmark script
        run: |
          python scripts/benchmark.py \
            --iterations "${{ env.BENCHMARK_ITERATIONS }}" \
            --output benchmark-results.json \
            ${{ env.BENCHMARK_INCLUDE_MEMORY == 'true' && '--measure-memory' || '' }}

      - name: Run pytest-benchmark suite (if available)
        run: |
          if python -c "import pytest_benchmark" 2>/dev/null; then
            python -m pytest tests/test_benchmarks.py --benchmark-only --benchmark-json=pytest-benchmark.json
          else
            echo "pytest-benchmark not installed; running performance assertions instead"
            python -m pytest tests/test_benchmarks.py -v --tb=short
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-py${{ github.event.inputs.python-version || '3.12' }}-${{ github.sha }}
          path: |
            benchmark-results.json
            pytest-benchmark.json
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark-results.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat benchmark-results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts uploaded with 90-day retention." >> "$GITHUB_STEP_SUMMARY"