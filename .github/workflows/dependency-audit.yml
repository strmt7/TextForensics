name: Dependency Audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve isolated runtime dependency set
        run: |
          python -m venv .runtime-audit
          .runtime-audit/bin/python -m pip install ".[all]"
          .runtime-audit/bin/python -m pip check
          .runtime-audit/bin/python -m pip freeze             | grep -viE '^textforensics([= @]|$)'             > runtime-requirements.txt
          test -s runtime-requirements.txt
          ! grep -qiE '^textforensics([= @]|$)' runtime-requirements.txt

      - name: Audit exact runtime dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --strict --no-deps -r runtime-requirements.txt
