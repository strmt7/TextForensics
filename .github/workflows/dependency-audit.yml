name: Dependency Audit

on:
  schedule:
    - cron: '31 4 * * 2'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - "setup.py"
      - "setup.cfg"

permissions:
  contents: read
  security-events: write
  actions: write

concurrency:
  group: dep-audit-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Pip Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --desc=on --format=json --output=pip-audit.json
      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pip-audit-results
          path: pip-audit.json
          retention-days: 30
      # NOTE: no SARIF upload. The former "Convert to SARIF" step ran
      # `pip install sarif-tool`, a package that does not exist on PyPI,
      # and the correctly-named `sarif-tools` provides only a `sarif`
      # CLI with no pip-audit-JSON-to-SARIF conversion (verified
      # 2026-11-07); pip-audit itself has no SARIF output format. The
      # step could never succeed — the job failed on its last scheduled
      # run too. The JSON artifact above preserves the audit output.
      # Restoring code-scanning visibility needs a real converter or
      # the pypa/gh-action-pip-audit action, as a deliberate follow-up.
