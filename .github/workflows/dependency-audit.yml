name: Dependency Audit

on:
  schedule:
    - cron: '31 4 * * 2'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - "setup.py"
      - "setup.cfg"

permissions:
  contents: read
  security-events: write

concurrency:
  group: dep-audit-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: Pip Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --desc=on --format=json --output=pip-audit.json
      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit.json
          retention-days: 30
      - name: Convert to SARIF
        run: |
          pip install sarif-tool
          sarif-tool convert --format=json --output=pip-audit.sarif pip-audit.json
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: pip-audit.sarif
          category: pip-audit
          wait-for-processing: true