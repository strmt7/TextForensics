[build-system]
# Pinned versions for reproducible builds
requires = ["setuptools>=75,<80", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

# Reproducible build configuration
# - setuptools<80: Known stable versions for reproducible builds
# - wheel>=0.45: Ensures consistent wheel building
# These versions are tested for deterministic output with SOURCE_DATE_EPOCH

[project]
name = "textforensics"
version = "0.2.0"
description = "Local-first AI-text detector reliability auditing, provenance, CLI, API and MCP."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Stratos Mitridis"}]
keywords = [
  "ai-detection",
  "text-forensics",
  "authorship",
  "provenance",
  "mcp",
  "stylometry",
  "detector-audit",
  "ai-safety",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.30,<1",
  "websockets>=12,<13",
]
mcp = [
  "mcp>=2,<3",
]
all = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "mcp>=2,<3",
  "uvicorn>=0.30,<1",
  "websockets>=12,<13",
]
cli-rich = [
  "rich>=13.9.4,<14",
]
cli-typer = [
  "rich>=13.9.4,<14",
  "typer>=0.12,<1",
]
enterprise = [
  "cryptography>=42.0.8,<43",
]
diagnostics = [
  "psutil>=6,<8",
]
fuzzing = [
  "atheris>=1.0,<2",
]
ollama = [
  "aiohttp>=3.9,<4",
]
telemetry = [
  "opentelemetry-api>=1.20,<2",
  "opentelemetry-exporter-prometheus>=0.60b0,<1",
  "opentelemetry-sdk>=1.20,<2",
]
dev = [
  "aiohttp>=3.9,<4",
  "build>=1.2,<2",
  "cosmic-ray>=8.0,<9",
  "coverage>=7.17.2,<8",
  "cryptography>=42.0.8,<43",
  "httpx>=0.27,<1",
  "hypothesis>=6.170,<7",
  "jsonschema>=4.23,<5",
  "opentelemetry-api>=1.20,<2",
  "opentelemetry-exporter-prometheus>=0.60b0,<1",
  "opentelemetry-sdk>=1.20,<2",
  "pre-commit>=3.8,<4",
  "psutil>=6,<8",
  "pytest>=8.4.2,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-benchmark>=4.0.0,<5",
  "pytest-cov>=5.0.0,<6",
  "pytest-timeout>=2.4.0,<3",
  "ruff>=0.15.22,<1",
  "twine>=4,<7",  # <7: twine 7 requires rich>=14.3.3, conflicting with the cli-rich rich<14 cap (Dependabot #32 widens rich in Phase 4)
]
security = [
  "bandit>=1.7.0,<2",
  "pip-audit>=2.10.1,<3",
]

[project.scripts]
textforensics = "textforensics.cli:main"
textforensics-api = "textforensics.server:main"
textforensics-mcp = "textforensics.mcp_server:main"
textforensics-typer = "textforensics.typer_cli:main"
textforensics-web = "textforensics.web_ui.main:main"

[project.entry-points."textforensics.detectors"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
textforensics = ["schemas/*.json", "_build_info.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  # pytest-benchmark's internal HTTP server emits ResourceWarning on
  # socket teardown (esp. Windows); a plugin artifact, not project code.
  "ignore::ResourceWarning",
]

# pytest-benchmark configuration for performance regression detection
# (configured via command line or pytest_benchmark.ini)
# Performance regression threshold: fail if >20% slower than baseline (mean)
# Usage: pytest tests/test_performance.py --benchmark-only --benchmark-compare=baseline.json --benchmark-compare-fail=mean:1.20

[tool.coverage.run]
branch = true
source = ["textforensics"]
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "I", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "B018", "SIM105", "S101"]
"src/textforensics/typer_cli.py" = ["B008", "B904"]
