#
# HOW TO ADD AN ENTRY
# -------------------
# 1. Verify the mutant per the PROOF above (diff + AST position +
#    no-evaluation + empirical probe for annotation mutants; exhaustive
#    differential runs + the dead-condition source reasoning for
#    unreachable-condition mutants; exhaustive differential runs + the
#    unobservable-value source reasoning for unobservable-value
#    mutants). Do not copy an entry and change
#    the numbers.
# 2. Add one [[equivalent]] entry with module, operator, occurrence,
#    start_pos, end_pos, function, kind and a reason naming the specific
#    annotation (kind "arg" / "return" / "annassign": also `annotation`)
#    or the specific dead condition / unobservable value (kind
#    "unreachable-condition" / "unobservable-value": also
#    `source_text` and `source_fingerprint`, computed with
#    scripts/run_mutation.py helpers `_enclosing_function` /
#    `_function_fingerprint`). No code change is needed.
# 3. Run tests/test_mutation.py and a full budget-200 run through
#    scripts/run_mutation.py for the affected module; the summary must
#    show the mutant under `equivalent`, not under
#    `unexplained_surviving`.
#
# MATCHING
# --------
# A live surviving mutant matches an entry iff (module, operator,
# start_pos, end_pos, occurrence) are equal. Occurrence is part of the
# key, not provenance only: one operator generates several distinct
# mutants at one position, and they need not share equivalence — at
# L542:54, `1` -> `2` is equivalent while `1` -> `0` is killable (see
# PROOF above). The annotation text / source text + function are
# re-validated against the current source on every run.

