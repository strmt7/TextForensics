# PROOF — BENCHMARK KIND "unobservable-value" (4 entries, 2026-11-08)
# ---------------------------------------------------------------
# [occ 0/1] dataset_sha256 L35:46, `1024` -> `1025` / `1023` (first
# factor of `handle.read(1024 * 1024)`). [occ 2/3] same line L35:53,
# `1024` -> `1025` / `1023` (second factor). The chunk size only
# controls how the file is read in 1 MiB blocks; the SHA-256 digest
