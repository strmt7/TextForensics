# PROOF — KIND "unobservable-value" (4 entries, verified 2026-11-07)
# ------------------------------------------------------------------
# These four NumberReplacer survivors sit in no branch condition, so
# "unreachable-condition" does not apply — yet no test can kill them,
# because the replacement value is provably unobservable: the mutated
# expression's value never affects any observable behaviour for any
# input. Each was verified by the 85/85 empirical probe above (the
# probe battery exercises every value below exhaustively, including
# the full tier matrix with unknown tiers) plus the source reasoning
# below. Each entry pins its proof with source_text + the enclosing
# function's fingerprint, exactly like unreachable-condition entries.
#
# [occ 4] CapabilityPolicyEngine.evaluate L376:33, `2` -> `3` in
#      `"validated": 2` of the tier_order table. The claim-tier value
#      is only ever compared as
#      `tier_order.get(claim_tier, -1) < tier_order.get(min_tier, -1)`
#      against min-tier values in {0, 1, 2, -1}; the comparison is
#      False for x in {2, 3} against every one of those, and the value
#      is used nowhere else. The sibling `2` -> `1` (occurrence 5) IS
#      killable — a VALIDATED claim then fails a validated requirement
#      — which is why entries are keyed by occurrence (see MATCHING).
# [occ 8] CapabilityPolicyEngine.evaluate L381:78, `-1` -> `-2` as the
#      default of `tier_order.get(min_tier, -1)` (the recorded position
#      is the `1`; cosmic-ray records the number literal, not the
#      sign). The claim-tier value is always >= -1 (valid tiers map to
#      0/1/2, unknown tiers to the other -1 default), so `claim < -1`
#      and `claim < -2` are both always False; the default is used
#      nowhere else. The siblings ARE killable: claim default -1 -> 0
#      (occurrence 7) and min default -1 -> 0 (occurrence 9) both flip
#      a comparison for a bogus-tier claim, and the tests kill them.
# [occ 22/23] _load_enterprise_policy_schema L540:19, `4` -> `5` /
#      `4` -> `3` in `@lru_cache(maxsize=4)`. The function takes no
#      arguments, so its cache can hold at most one entry and maxsize
#      3/4/5 never triggers eviction; the cached value and call
#      behaviour are identical. (These two entries are also the reason
#      the runner's enclosing-function lookup and function fingerprint
#      cover decorator lines: the mutant sits on the decorator line,
#      above the `def` line.)
#
