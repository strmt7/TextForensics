# PROOF — BENCHMARK KIND "unobservable-value" (4 entries, 2026-11-08)
# ---------------------------------------------------------------
# [occ 0/1] dataset_sha256 L35:46, `1024` -> `1025` / `1023` (first
# factor of `handle.read(1024 * 1024)`). [occ 2/3] same line L35:53,
# `1024` -> `1025` / `1023` (second factor). The chunk size only
# controls how the file is read in 1 MiB blocks; the SHA-256 digest
# over the stream is independent of chunk size for any file content
# and any chunk size >= 1, so no input distinguishes either mutant.
# Verified by the differential probe (240 KB and ~2 MB files hashed
# identically under every variant, including the 1-byte-chunk
# `1024 // 1024` variant below) plus the source reasoning above. Each
# entry pins its proof with source_text + the enclosing function's
# fingerprint, exactly like the policy entries.
#
# KNOWN BENCHMARK MUTANTS *NOT* IN THIS BASELINE (do not add without
# a new kind + its own validator — see below)
# ------------------------------------------------------------
# Thirteen survivors are genuinely equivalent but fit NEITHER
# existing kind (annotation / unreachable-condition /
# unobservable-value, whose documented scope is NumberReplacer), so
# they are NOT baselined and the gate will report them unexplained
# until a new kind exists. Each was verified by hand-applying the
# mutant to a scratch copy and comparing behaviour across a fixed
# battery (13/13 byte-identical, including 240 KB / ~2 MB files,
# diverse texts, 3 calibration fixtures x 6 targets, and
# verify_fingerprint error cases):
# - [620] ReplaceFalseWithTrue occ 0, L74, `include_robustness=False`
#   -> `True` in _load_scores. `analyze_text` computes `.score` in
#   `_base_score` before the flag is consulted (engine.py:73); the
#   flag only affects stability / diagnostic_reliability / warnings,
#   which _load_scores never reads. `.score` is identical for every
#   input.
# - [501/502/503/510] ReplaceBinaryOperator_Mul_* occ 0, L35,
#   `1024 * 1024` -> `+` (2048) / `&` (1024) / `|` (1024) / `//` (1).
#   Same chunk-size reasoning as the four baselined NumberReplacer
#   entries above, but these are binary-operator replacements, not
#   NumberReplacer, so the "unobservable-value" kind does not cover
#   them as documented.
# - [642/644/645] ReplaceTrueWithFalse occ 6/8/9, L361/L420/L428,
#   `sort_keys=True` -> `False` in json.dumps calls whose dict keys
#   are already in sorted order (single-key `{"text": ...}` at L361
#   and L428; `{"label": ..., "text": ...}` — "label" < "text" — at
#   L420), so the serialised form is identical. Not NumberReplacer.
# - [664/666/668] ReplaceUnaryOperator_* occ 1, L175, `-threshold`
#   -> `threshold` / `not threshold` / `+threshold` in the
#   calibration candidate tuple `(tpr, -fpr, -threshold)`. The third
#   element never decides the maximum: distinct candidate thresholds
#   always give distinct (tpr, -fpr) pairs (moving past a threshold
#   drops at least the rows scoring exactly at it, so tp or fp
#   strictly decreases), so the tiebreak is dead. Not NumberReplacer.
# - [575] ReplaceComparisonOperator_Gt_GtE occ 0, L176, `candidate >
#   best[0]` -> `>=`. Same distinctness proof: candidate tuples are
#   never equal, so `>=` never differs from `>`.
# - [548] ReplaceComparisonOperator_Eq_LtE occ 7, L538,
#   `len(result["errors"]) == 0` -> `<= 0`. Lengths are always >= 0,
#   so the two are identical for every input.
# Do NOT baseline these 13 by stretching "unobservable-value" — the
# kind's documented scope is NumberReplacer, and silently widening it
# would be the blanket-rule rot this mechanism exists to prevent. A
# new kind needs its own validator first (see run_mutation.py).
#
# HOW TO ADD AN ENTRY
# -------------------
# 1. Verify the mutant per the PROOF above (diff + AST position +
#    no-evaluation + empirical probe for annotation mutants; exhaustive
#    differential runs + the dead-condition source reasoning for
#    unreachable-condition mutants; exhaustive differential runs + the
#    unobservable-value source reasoning for unobservable-value
#    mutants). Do not copy an entry and change
#    the numbers.
# 2. Add one [[equivalent]] entry with module, operator, occurrence,
#    start_pos, end_pos, function, kind and a reason naming the specific
#    annotation (kind "arg" / "return" / "annassign": also `annotation`)
#    or the specific dead condition / unobservable value (kind
#    "unreachable-condition" / "unobservable-value": also
#    `source_text` and `source_fingerprint`, computed with
#    scripts/run_mutation.py helpers `_enclosing_function` /
#    `_function_fingerprint`). No code change is needed.
# 3. Run tests/test_mutation.py and a full budget-200 run through
#    scripts/run_mutation.py for the affected module; the summary must
#    show the mutant under `equivalent`, not under
#    `unexplained_surviving`.
#
# MATCHING
# --------
# A live surviving mutant matches an entry iff (module, operator,
# start_pos, end_pos, occurrence) are equal. Occurrence is part of the
# key, not provenance only: one operator generates several distinct
# mutants at one position, and they need not share equivalence — at
# L542:54, `1` -> `2` is equivalent while `1` -> `0` is killable (see
# PROOF above). The annotation text / source text + function are
# re-validated against the current source on every run.

