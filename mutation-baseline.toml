# mutation-baseline.toml — equivalent-mutant baseline for TextForensics.
#
# POSITION REFRESH (2026-11-07, wave-2 docstring record in trust.py):
# adding the wave-2 baseline note to trust.py's module docstring moved
# every line below it down by 11, so every entry's start_pos/end_pos
# was shifted +11 lines (columns unchanged) and re-validated against
# the new source — all 73 entries validate. The line numbers quoted in
# the PROOF sections below still refer to trust.py at 153b5ab/76fc8b1,
# where the equivalence proofs were established; add 11 for the
# current positions.
#
# WHAT THIS IS
# ------------
# Cosmic Ray mutates `|` (BitOr) inside function annotations of
# `textforensics.trust`, and the mutants survive: no test can kill them,
# because the mutation changes only an annotation *string* that is never
# evaluated. Each entry below is one such mutant, individually verified
# (see PROOF) and individually justified. This file does NOT weaken the
# gate: the gate still fails on any UNEXPLAINED survivor (exit 2), and a
# baseline entry that no longer matches the current source fails LOUDLY
# (exit 1) instead of passing silently. Raw counts are never relabelled:
# the summary keeps `total` / `killed` / `surviving` exactly as measured
# and reports `equivalent` / `unexplained_surviving` / `equivalent_dormant`
# / `equivalent_superseded` / `stale_baseline_entries` alongside them.
# Equivalent mutants are NEVER counted as killed.
#
# DESIGN DECISION (hybrid: explicit baseline + structural re-validation)
# ----------------------------------------------------------------------
# Two candidates were considered:
#   (a) a checked-in baseline/allowlist, one entry per equivalent mutant;
#   (b) a structural rule in the runner that excludes any mutant whose
#       start position falls inside an annotation (AST-based).
# Neither alone is sufficient:
#   - (b) alone would silently accept ANY future annotation mutant with no
#     human review, including one that later becomes behaviour-changing
#     (e.g. if `from __future__ import annotations` were removed, or if
#     annotation evaluation were introduced). It is a blanket rule, and
#     blanket rules rot into blanket ignores.
#   - (a) alone rots the other way: positions shift, entries stop matching,
#     and a static file becomes dead weight nobody re-checks.
# The mechanism is therefore a hybrid: (a) explicit per-mutant entries
# (auditable, individually justified, addable without code changes) PLUS
# (b) as a *validator*, not as an acceptor — on every run the runner
# re-validates each entry against the CURRENT source (AST: the recorded
# position must still hold `|` inside an annotation, the annotation text
# must be unchanged, and the module must still use postponed evaluation).
# An entry that fails re-validation is STALE and fails the run with
# exit 1. An entry that passes re-validation but matched no live survivor
# in this run is DORMANT (reported, not failed): the mutant was not
# executed in this run, e.g. it fell outside the budget-200 prefix.
# An entry whose mutant was executed and KILLED is SUPERSEDED (reported):
# the tests now catch it, the entry is unnecessary, and a human should
# remove it — leaving it is harmless only because it can only ever
# excuse survivors, never kills.
#
# PROOF (per-mutant, verified 2026-11-07 against run 42393966895)
# ---------------------------------------------------------------
# For each of the 69 mutants: the CI diff replaces exactly the `|` at the
# recorded start position with one other operator (+, &, ^, /, //); the
# position lies inside a function argument or return annotation (checked
# with `ast` + `tokenize` against trust.py at commit 76fc8b1, which is
# byte-identical to the CI commit 153b5ab for trust.py); and the enclosing
# function matches the entry. 69/69 verified, 0 exceptions.
# The 15 distinct positions are exactly the `|` operators inside function
# annotations in trust.py (verified: mutant positions == function-annotation
# `|` positions). Three further `|` operators exist in TrustMap dataclass
# field annotations (L103, L104, L106) but cosmic-ray 8.7.0 never generates
# mutants for them — it deliberately excludes `|` in assignment
# annotations (parso `annassign` rule in
# cosmic_ray/operators/binary_operator_replacement.py, function
# `_is_binary_operator`). Nothing to baseline there.
# Why the annotation change cannot affect behaviour:
#   1. trust.py has `from __future__ import annotations` (line 30), so
#      under PEP 563 every annotation in the module is a string, stored
#      unevaluated at function definition and call time.
#   2. Nothing evaluates these annotations: no `get_type_hints`,
#      `__annotations__`, `eval_str`, `get_annotations` or `ForwardRef`
#      anywhere in src/, tests/ or scripts/ (grep, 2026-11-07); no
#      pydantic / TypeAdapter; no `inspect.signature(..., eval_str=True)`.
#      This is guarded by a test (tests/test_mutation.py).
#   3. dataclasses never evaluates string annotations: TrustMap /
#      TrustDimension field types stay strings (`dataclasses.fields(...).type`
#      is `str`), and `__init__` / `__post_init__` / `asdict` use field
#      names and values only.
#   4. Empirical check: all 75 mutants (15 positions x 5 operators,
#      including the 6 FloorDiv mutants never executed in CI) were applied
#      to a copy of trust.py and probed (construction, validation,
#      dimension(), assess_trust_map(), build_trust_map()); all 75 produced
#      byte-identical behaviour, differing only in the annotation string
#      itself. 75/75.
# The mutated annotation strings are all syntactically valid expressions
# (`X + None`, `X / None`, ...), so the mutants compile and run — that is
# why they report as "survived" rather than "incompetent".
#
# KNOWN MUTANTS *NOT* IN THIS BASELINE (do not add without verification)
# ---------------------------------------------------------------------
# - ReplaceBinaryOperator_BitOr_FloorDiv occurrences 9-14 (positions
#   L420, L421, L422:18, L422:24, L425, L426): same 15 positions, same
#   proof (they are in the 75/75 empirical check), but they were never
#   executed in run 42393966895 — the budget-200 trim cut the session at
#   200 work items and FloorDiv sorts last. If a future run with a larger
#   budget executes them and they survive, the gate fails (exit 2) until
#   a human adds verified entries. That is by design.
# - The other six BitOr replacement operators (LShift, Mod, Mul, Pow,
#   RShift, Sub) x 15 positions = 90 mutants: present in the full 618-item
#   session, never executed under budget 200. Same rule: verify, then add.
# - The remaining 50 AddNot / NumberReplacer / ReplaceAndWithOr survivors
#   are NOT equivalent; they are runtime mutants killed with tests by a
#   parallel worker (PR #52). Four of the original 54 were reclassified
#   as equivalent instead and ARE in this file, as kind
#   "unreachable-condition" (see PROOF below). Never add a runtime mutant
#   to this file except as "unreachable-condition" or "unobservable-value",
#   with its proof.
#
