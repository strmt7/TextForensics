# PROOF — KIND "unobservable-value" (4 entries, verified 2026-11-07)
# ------------------------------------------------------------------
# These four NumberReplacer survivors sit in no branch condition, so
# "unreachable-condition" does not apply — yet no test can kill them,
# because the replacement value is provably unobservable: the mutated
# expression's value never affects any observable behaviour for any
# input. Each was verified by the 85/85 empirical probe above (the
# probe battery exercises every value below exhaustively, including
# the full tier matrix with unknown tiers) plus the source reasoning
# below. Each entry pins its proof with source_text + the enclosing
# function's fingerprint, exactly like unreachable-condition entries.
#
# [occ 4] CapabilityPolicyEngine.evaluate L376:33, `2` -> `3` in
#      `"validated": 2` of the tier_order table. The claim-tier value
#      is only ever compared as
#      `tier_order.get(claim_tier, -1) < tier_order.get(min_tier, -1)`
#      against min-tier values in {0, 1, 2, -1}; the comparison is
#      False for x in {2, 3} against every one of those, and the value
#      is used nowhere else. The sibling `2` -> `1` (occurrence 5) IS
#      killable — a VALIDATED claim then fails a validated requirement
#      — which is why entries are keyed by occurrence (see MATCHING).
# [occ 8] CapabilityPolicyEngine.evaluate L381:78, `-1` -> `-2` as the
#      default of `tier_order.get(min_tier, -1)` (the recorded position
#      is the `1`; cosmic-ray records the number literal, not the
#      sign). The claim-tier value is always >= -1 (valid tiers map to
#      0/1/2, unknown tiers to the other -1 default), so `claim < -1`
#      and `claim < -2` are both always False; the default is used
#      nowhere else. The siblings ARE killable: claim default -1 -> 0
#      (occurrence 7) and min default -1 -> 0 (occurrence 9) both flip
#      a comparison for a bogus-tier claim, and the tests kill them.
# [occ 22/23] _load_enterprise_policy_schema L540:19, `4` -> `5` /
#      `4` -> `3` in `@lru_cache(maxsize=4)`. The function takes no
#      arguments, so its cache can hold at most one entry and maxsize
#      3/4/5 never triggers eviction; the cached value and call
#      behaviour are identical. (These two entries are also the reason
#      the runner's enclosing-function lookup and function fingerprint
#      cover decorator lines: the mutant sits on the decorator line,
#      above the `def` line.)
#
# KNOWN POLICY MUTANTS *NOT* IN THIS BASELINE (do not add without verification)
# -----------------------------------------------------------------------------
# - ReplaceBinaryOperator_BitOr_Pow at L914, L922, L929: same 9
#   positions, same proof (they are in the 85/85 empirical check), but
#   they were never executed in the budget-200 run — the trim cut the
#   session at 200 work items and Pow sorts last at those positions.
#   If a future run with a larger budget executes them and they
#   survive, the gate fails (exit 2) until a human adds verified
#   entries. That is by design.
# - The remaining 298 work items of the 498-item session were never
#   executed under budget 200 (same rule: verify, then add).
#
# PROOF — KIND "unreachable-condition" (4 entries, verified 2026-11-07)
# ------------------------------------------------------------------
# These four NumberReplacer survivors sit in branch conditions that are
# provably dead: the condition reduces to a constant False for every
# replacement the operator generates at that position, so no input can
# distinguish mutant from original. Each was verified by exhaustive
# differential runs (original vs hand-applied mutant, all reachable
# inputs compared) plus the source reasoning below.
#
# [41] build_trust_map L437:24, `0` -> `-1` in `if word_count < 0:`
#      raise ValueError("word_count must be non-negative."). For
#      word_count == -1 the mutant skips the check, but the very next
#      statement calls length_band(word_count), which raises the
#      IDENTICAL ValueError (same type, same message,
#      conditions.py: length_band guards `word_count < 0`). For
#      word_count <= -2 both raise at the check; for >= 0 neither
#      raises. No test can observe a difference.
# [44] trust_map_from_capability_ledger L542:54, `1` -> `2` in
#      max(1, len(dimensions) // 2). [46] same line L542:76, `2` -> `3`
#      in len(dimensions) // 2. [47] same position, `2` -> `1`.
#      The guarded condition is
#        if out_of_scope_count or unknown_count >= max(1, len(dimensions) // 2):
#      and it is dead by construction: `capabilities` is built from the
#      ledger's own claims and the loop iterates exactly those
#      capabilities, so `relevant` is never empty and no dimension is
#      ever "unknown" (unknown_count == 0 always); no dimension is ever
#      assigned "out_of_scope" either (the only states assigned are
#      "unknown" / "supported" / "partial", and "unknown" is unreachable
#      as shown), so out_of_scope_count == 0 always. The condition
#      therefore reduces to `0 >= threshold` with threshold =
#      max(1, len//2) >= 1 under every variant above — always False.
#      The sharp edge proving the mutants are equivalent ONLY for these
#      replacements: the sibling mutant at the same position,
#      max(1, ...) -> max(0, ...) (occurrence 43), is KILLABLE — when
#      len(dimensions) < 2 the threshold becomes 0 and `0 >= 0` is True,
#      flipping overall to "insufficient"; the tests kill it. That is
#      why entries are keyed by occurrence as well as position (see
#      MATCHING): a position-level entry would conflate the equivalent
#      1 -> 2 with the killable 1 -> 0.
# Each entry pins its proof to the current source with source_text (the
# exact original literal) and source_fingerprint (SHA-256 of the
# whitespace-normalised enclosing function). Any edit to that function
# makes the entry stale (exit 1) until a human re-verifies the proof.
# A future larger-budget run may execute further NumberReplacer
# replacements at these positions (e.g. `2` -> `0` at L542:76 would raise
# ZeroDivisionError when the line evaluates, so it is killed, not
# equivalent); such mutants have different occurrences, match no entry,
# and fail the gate as unexplained until verified — by design.
#
