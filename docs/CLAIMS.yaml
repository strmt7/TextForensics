# CLAIMS.yaml — Machine-verifiable claims registry for TextForensics
#
# Each claim must have:
# - id: unique identifier
# - statement: exact user-facing claim
# - category: capability|performance|security|privacy|standards|compatibility|maturity
# - status: verified|partially_verified|unverified|false|stale
# - evidence_type: test|benchmark_artifact|code_audit|doc|external_audit|command
# - evidence_path: path to verification evidence (file, test, benchmark output)
# - verification_command: optional command to re-verify
# - owner: team/component responsible
# - last_verified: ISO date (must equal the evidence record's run_date)
# - notes: caveats, limitations, scope
# - evidence_record_id: U7 — ID in docs/evidence/registry.json (required)
# - run_artifact_sha256: U7 — SHA-256 of the cited run artifact (required)
# - values: U7 — optional map of metric -> expected value, compared
#   against the cited record's results (dotted paths for nested
#   metrics, e.g. packages.cryptography). Every scalar value must
#   appear in the statement.
# - tolerance: U7 — optional numeric tolerance for values comparison
#
# CI (check_claims.py, the U7 claim-to-evidence gate) will:
# 1. Parse this file (duplicate YAML keys are rejected)
# 2. Load docs/evidence/registry.json and re-hash every run artifact
# 3. For each claim, verify the evidence linkage: record exists, hashes
#    match, the record is not >90 days old, the detector version has not
#    changed since the run, the artifact has a drops manifest, and the
#    values map matches the record's results
# 4. For each claim, run the evidence-type check (test / command / doc /
#    code_audit / benchmark_artifact / external_audit)
# 5. Fail CI on any claim with status=unverified, false, or stale, or
#    whose linkage fails (stale / incomplete / hash mismatch)
# 6. Write docs/evidence/report-card.md (deterministic; CI diffs it)
#
# Rules for this file (AGENTS.md rule 1: never invent benchmark results):
# - A claim's statement must match what its evidence actually shows.
# - Numbers come from the cited run artifact in docs/evidence/runs/
#   (suite and dependency measurements re-seeded 2026-11-07; dataset
#   artifacts measured 2026-11-06/2026-11-07), never from an earlier run
#   or from memory.
# - Capabilities with no release-grade evidence (dataset measurements
#   are preliminary; DetectRL/M4/M4GT-Bench/MixSet are licence-blocked)
#   have NO claim here at all. A missing claim is honest; a
#   partially_verified placeholder is not.
# - Duplicate YAML keys are rejected by check_claims.py (see F12, audit §4).
# - Never edit a run artifact to match a claim: re-run
#   scripts/seed_evidence.py, then update the claim's
#   evidence_record_id, run_artifact_sha256, and values to the new record.

claims:
  - id: "core.local_first"
    statement: "TextForensics is local-first; no text leaves the machine unless the user explicitly selects an opt-in remote adapter"
    category: "privacy"
    status: "verified"
    evidence_type: "code_audit"
    evidence_path: "src/textforensics/"
    owner: "core"
    last_verified: "2026-11-07"
    notes: "Three src/ files import a network client (AST scan EV-20261107-code-audit), each user-triggered and opt-in: datasets.py (http.client + urllib.request, datasets.py:70,78-80; urlopen at :551 for downloads and :1246 for the Hugging Face datasets-server API client) — only on an explicit dataset operation (licence-gated fetch/download via scripts/measure_datasets.py, build_probe_corpus.py, measure_segments.py and the U1 fetch path); it downloads benchmark data and never uploads user text. ollama.py (aiohttp client, ollama.py:36, session at :385-409; urlparse at :34 is parse-only, no I/O) — only when the user selects the opt-in Ollama adapter; it is never eagerly imported. timestamp.py (urllib.request TSA POST client, timestamp.py:30-31, urlopen at :410) — only with --timestamp-url, which requires --seal (cli.py:1791-1792), and it POSTs only a hash digest, never text. adapter_scanner.py only names network libraries inside static-analysis rules; it imports none of them. Core analysis itself performs no network I/O on any default path."
    evidence_record_id: "EV-20261107-code-audit"
    run_artifact_sha256: "02860fa133b44baef1587323fb8d7657b86f8220f5908d8d8a05455108aabc13"
    values:
      network_import_files:
        - "src/textforensics/datasets.py"
        - "src/textforensics/ollama.py"
        - "src/textforensics/timestamp.py"

