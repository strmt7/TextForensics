# CLAIMS.yaml — Machine-verifiable claims registry for TextForensics
# 
# Each claim must have:
# - id: unique identifier
# - statement: exact user-facing claim
# - category: capability|performance|security|privacy|standards|compatibility|maturity
# - status: verified|partially_verified|unverified|false|stale
# - evidence_type: test|benchmark_artifact|code_audit|doc|external_audit
# - evidence_path: path to verification evidence (file, test, benchmark output)
# - verification_command: optional command to re-verify
# - owner: team/component responsible
# - last_verified: ISO date
# - notes: caveats, limitations, scope
#
# CI (check_claims.py) will:
# 1. Parse this file
# 2. For each claim with evidence_type=test, run the test or check the test file exists
# 3. For benchmark_artifact, verify the artifact file exists and has required fields
# 4. For code_audit, verify the code path exists
# 5. Fail CI on any claim with status=unverified, false, or stale

claims:
  - id: "core.local_first"
    statement: "TextForensics is local-first; no text leaves the machine unless user explicitly selects an opt-in remote adapter"
    category: "privacy"
    status: "verified"
    evidence_type: "code_audit"
    evidence_path: "src/textforensics/"
    owner: "core"
    last_verified: "2026-11-05"
    notes: "No network calls in core modules; remote adapters opt-in only"

  - id: "core.no_telemetry"
    statement: "No silent telemetry; no raw text in logs"
    category: "privacy"
    status: "verified"
    evidence_type: "code_audit"
    evidence_path: "src/textforensics/"
    owner: "core"
    last_verified: "2026-11-05"
