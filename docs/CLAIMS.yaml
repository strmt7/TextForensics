# CLAIMS.yaml — Machine-verifiable claims registry for TextForensics
#
# Each claim must have:
# - id: unique identifier
# - statement: exact user-facing claim
# - category: capability|performance|security|privacy|standards|compatibility|maturity
# - status: verified|partially_verified|unverified|false|stale
# - evidence_type: test|benchmark_artifact|code_audit|doc|external_audit|command
# - evidence_path: path to verification evidence (file, test, benchmark output)
# - verification_command: optional command to re-verify
# - owner: team/component responsible
# - last_verified: ISO date
# - notes: caveats, limitations, scope
#
# CI (check_claims.py) will:
# 1. Parse this file
# 2. For each claim with evidence_type=test, run the test or check the test file exists
# 3. For benchmark_artifact, verify the artifact file exists and has required fields
# 4. For code_audit, verify the code path exists
# 5. Fail CI on any claim with status=unverified, false, or stale
#
# Rules for this file (AGENTS.md rule 1: never invent benchmark results):
# - A claim's statement must match what its evidence actually shows.
# - Numbers come from docs/VERIFICATION.md (measured 2026-11-06) or from
#   the cited test; nothing is copied from an earlier run.
# - Capabilities with no implementation (RAID/DetectRL/M4 integration)
#   have NO claim here at all. A missing claim is honest; a
#   partially_verified placeholder is not.
# - Duplicate YAML keys are rejected by check_claims.py (see F12, audit §4).

claims:
  - id: "core.local_first"
    statement: "TextForensics is local-first; no text leaves the machine unless the user explicitly selects an opt-in remote adapter"
    category: "privacy"
    status: "verified"
    evidence_type: "code_audit"
    evidence_path: "src/textforensics/"
    owner: "core"
    last_verified: "2026-11-06"
    notes: "The only network client import in src/ is ollama.py (opt-in Ollama adapter). adapter_scanner.py only names network libraries inside static-analysis rules; it imports none of them."

  - id: "core.no_telemetry"
    statement: "No silent telemetry: metrics are recorded only after explicit --metrics opt-in, and no raw text is recorded in logs or metrics"
    category: "privacy"
    status: "verified"
    evidence_type: "test"
    evidence_path: "tests/test_telemetry.py"
    owner: "core"
    last_verified: "2026-11-06"
    notes: "telemetry.initialize_telemetry() is called only from cli.py when --metrics is passed; engine.py records only when is_telemetry_initialized(). The exporter is a local Prometheus reader; instruments are counts/latencies, never text."

  - id: "core.agpl_license"
